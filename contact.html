<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <!-- Ye niche wali line add kar do -->
  <link rel="icon" type="image/png" href="profile.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-gray-200 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-10 items-start">
    
    <!-- Left Section -->
    <div class="space-y-6">
      <h1 class="text-4xl font-bold text-white">Contact Us</h1>
      <p class="text-gray-400">
        We are available for questions, feedback, or collaboration opportunities. Let us know how we can help!
      </p>
      <p class="text-gray-400">
        You can also contact us at <br>
        <a href="mailto:ahsan2164ali@gmail.com" class="text-white underline font-semibold">ahsan2164ali@gmail.com</a> for any payment or course access related queries.
      </p>
      <div class="rounded-lg overflow-hidden border border-gray-800 shadow-lg">
  <img src="profile.png" alt="Ahsan Ali" class="w-full h-auto object-cover">
</div>
    </div>

    <!-- Right Section (Form) -->
    <form action="https://formspree.io/f/mkjwpnda" method="POST" class="space-y-4 bg-[#0f1522] p-6 rounded-xl border border-gray-800 shadow-xl">
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Name</label>
        <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-2.5 bg-[#0b0f17] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Email</label>
        <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-2.5 bg-[#0b0f17] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Subject</label>
        <input type="text" name="subject" placeholder="Subject" required class="w-full px-4 py-2.5 bg-[#0b0f17] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Message</label>
        <textarea name="message" rows="4" placeholder="Type your message here." required class="w-full px-4 py-2.5 bg-[#0b0f17] border border-gray-700 rounded-lg text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition duration-200">
        Send Message
      </button>
    </form>

  </div>

</body>
</html>
