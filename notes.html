<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahsan Web Studio - Notes Hub</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Plus Jakarta Sans", sans-serif;

            background: #090d16;

            color: #ffffff;

            min-height: 100vh;

            padding: 40px 20px;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 1260px;

            margin: auto;

        }


        /* =========================
           HEADER
        ========================= */

        .page-header {

            text-align: center;

            margin-bottom: 45px;

        }


        .page-header h1 {

            font-size: 2.4rem;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .page-header h1 span {

            color: #38bdf8;

        }


        .page-header p {

            color: #9ca3af;

            font-size: 0.95rem;

        }


        /* =========================
           CARDS GRID
        ========================= */

        .notes-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 24px;

        }


        /* =========================
           NOTE CARD
        ========================= */

        .note-card {

            background: #0d121d;

            border: 1px solid #202938;

            border-radius: 8px;

            min-height: 300px;

            padding: 24px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .note-card:hover {

            transform: translateY(-5px);

            border-color: #38bdf8;

            background: #111827;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

        }


        /* =========================
           ICON
        ========================= */

        .icon-box {

            width: 128px;

            height: 128px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 22px;

            font-size: 64px;

        }


        /* Python */

        .python-icon {

            background: #3776ab;

            color: #ffd343;

        }


        /* HTML */

        .html-icon {

            background: #e44d26;

            color: #ffffff;

        }


        /* =========================
           CARD TEXT
        ========================= */

        .note-card h2 {

            font-size: 1.1rem;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .note-card p {

            color: #9ca3af;

            font-size: 0.88rem;

            line-height: 1.5;

            margin-bottom: 20px;

        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-btn {

            width: 100%;

            margin-top: auto;

            padding: 11px 15px;

            border: none;

            border-radius: 6px;

            background: #202a3a;

            color: #ffffff;

            font-family: inherit;

            font-size: 0.9rem;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .open-btn:hover {

            background: #2c3a50;

        }


        .open-btn:active {

            transform: scale(0.98);

        }


        /* =========================
           PDF VIEWER
        ========================= */

        .pdf-viewer {

            display: none;

            margin-top: 45px;

            background: #111827;

            border: 1px solid #202938;

            border-radius: 12px;

            padding: 20px;

        }


        .pdf-viewer.show {

            display: block;

        }


        /* =========================
           PDF HEADER
        ========================= */

        .pdf-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }


        .pdf-title {

            font-size: 1.2rem;

            font-weight: 700;

        }


        .close-btn {

            display: flex;

            align-items: center;

            gap: 8px;

            background: transparent;

            border: 1px solid #374151;

            color: #ffffff;

            padding: 8px 14px;

            border-radius: 7px;

            font-family: inherit;

            cursor: pointer;

        }


        .close-btn:hover {

            background: #1f2937;

        }


        /* =========================
           PDF FRAME
        ========================= */

        .pdf-frame {

            display: block;

            width: 100%;

            height: 700px;

            border: 1px solid #374151;

            border-radius: 8px;

            background: #000000;

        }


        /* =========================
           DOWNLOAD BUTTON
        ========================= */

        .download-area {

            margin-top: 18px;

        }


        .download-btn {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 14px 20px;

            background: #202a3a;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-size: 0.95rem;

            font-weight: 600;

            transition:
                background 0.2s ease;

        }


        .download-btn:hover {

            background: #2c3a50;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .notes-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }

        }


        @media (max-width: 600px) {

            body {

                padding: 25px 12px;

            }


            .page-header {

                margin-bottom: 30px;

            }


            .page-header h1 {

                font-size: 1.8rem;

            }


            .notes-grid {

                grid-template-columns: 1fr;

                gap: 18px;

            }


            .note-card {

                min-height: 290px;

            }


            .pdf-viewer {

                margin-top: 30px;

                padding: 12px;

            }


            .pdf-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .close-btn {

                width: 100%;

                justify-content: center;

            }


            .pdf-frame {

                height: 550px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADER
        ========================= -->

        <header class="page-header">

            <h1>
                <span>Ahsan Web Studio</span>
                Notes
            </h1>

            <p>
                Download and read programming notes
            </p>

        </header>


        <!-- =========================
             NOTES CARDS
        ========================= -->

        <section class="notes-grid">


            <!-- =====================
                 PYTHON CARD
            ====================== -->

            <div
                class="note-card"
                onclick="openPDF(
                    'Python Crash Course',
                    'Python-Crash-Course.pdf',
                    'Download Python Crash Course'
                )">


                <div class="icon-box python-icon">

                    <i class="fa-brands fa-python"></i>

                </div>


                <h2>
                    Python Crash Course
                </h2>


                <p>
                    Download Python Crash Course Notes
                </p>


                <button
                    type="button"
                    class="open-btn"
                    onclick="event.stopPropagation(); openPDF(
                        'Python Crash Course',
                        'Python-Crash-Course.pdf',
                        'Download Python Crash Course'
                    )">

                    <i class="fa-solid fa-file-pdf"></i>

                    Open PDF

                </button>


            </div>



            <!-- =====================
                 HTML CARD
            ====================== -->

            <div
                class="note-card"
                onclick="openPDF(
                    'HTML Basic Notes',
                    'HTML_Detailed_English_Notes_Ahsan_Web_Studio.pdf',
                    'Download Basic Notes'
                )">


                <div class="icon-box html-icon">

                    <i class="fa-brands fa-html5"></i>

                </div>


                <h2>
                    HTML Basic Notes
                </h2>


                <p>
                    Download Basic HTML Notes
                </p>


                <button
                    type="button"
                    class="open-btn"
                    onclick="event.stopPropagation(); openPDF(
                        'HTML Basic Notes',
                        'HTML_Detailed_English_Notes_Ahsan_Web_Studio.pdf',
                        'Download Basic Notes'
                    )">

                    <i class="fa-solid fa-file-pdf"></i>

                    Open PDF

                </button>


            </div>


        </section>


        <!-- =========================
             PDF VIEWER
        ========================= -->

        <section
            class="pdf-viewer"
            id="pdfViewer">


            <div class="pdf-header">


                <div
                    class="pdf-title"
                    id="pdfTitle">

                    PDF Notes

                </div>


                <button
                    type="button"
                    class="close-btn"
                    onclick="closePDF()">

                    <i class="fa-solid fa-xmark"></i>

                    Close

                </button>


            </div>


            <!-- PDF -->

            <iframe
                id="pdfFrame"
                class="pdf-frame"
                src=""
                title="PDF Viewer">
            </iframe>


            <!-- Download -->

            <div class="download-area">

                <a
                    id="downloadButton"
                    class="download-btn"
                    href="#"
                    download>

                    <i class="fa-solid fa-download"></i>

                    <span id="downloadText">
                        Download PDF
                    </span>

                </a>

            </div>


        </section>


    </div>



    <script>

        /* =========================
           OPEN PDF
        ========================= */

        function openPDF(title, file, downloadTitle) {

            const viewer =
                document.getElementById("pdfViewer");

            const frame =
                document.getElementById("pdfFrame");

            const titleElement =
                document.getElementById("pdfTitle");

            const downloadButton =
                document.getElementById("downloadButton");

            const downloadText =
                document.getElementById("downloadText");


            /* PDF title */

            titleElement.textContent = title;


            /* PDF file */

            frame.src = file;


            /* Download file */

            downloadButton.href = file;


            /* Download button text */

            downloadText.textContent =
                downloadTitle;


            /* Show viewer */

            viewer.classList.add("show");


            /* Scroll to viewer */

            setTimeout(function () {

                viewer.scrollIntoView({

                    behavior: "smooth",

                    block: "start"

                });

            }, 100);

        }


        /* =========================
           CLOSE PDF
        ========================= */

        function closePDF() {

            const viewer =
                document.getElementById("pdfViewer");

            const frame =
                document.getElementById("pdfFrame");


            /* Stop PDF */

            frame.src = "";


            /* Hide viewer */

            viewer.classList.remove("show");

        }

    </script>


</body>

</html>
