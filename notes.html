<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Handbooks</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 50px;
        }

        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 35px 25px 25px 25px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #374151;
        }

        .icon-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 4rem;
            background-color: #0284c7;
            color: #38bdf8;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .download-btn {
            width: 100%;
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 12px 0;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: background-color 0.2s ease;
        }

        .download-btn:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>

    <h1 class="title">Download Handbooks</h1>

    <div class="grid-container">
        
        <!-- Python Single Card -->
        <div class="card">
            <div class="icon-circle">
                <i class="fa-brands fa-python"></i>
            </div>
            <h2 class="card-title">Python Handbook</h2>
            <p class="card-subtitle">Download Handbook Here</p>
            <a href="Python-Crash-Course.pdf" download class="download-btn">Download</a>
        </div>

    </div>

</body>
</html>
