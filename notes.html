<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ahsan Web Studio - Notes Hub</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: 'Plus Jakarta Sans', sans-serif;

            background: #090d16;

            color: #ffffff;

            min-height: 100vh;

            padding: 40px 20px;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            max-width: 1260px;

            margin: auto;

        }


        /* =========================
           HEADER
        ========================= */

        .page-header {

            text-align: center;

            margin-bottom: 45px;

        }


        .page-header h1 {

            font-size: 2.5rem;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .page-header p {

            color: #9ca3af;

            font-size: 1rem;

        }


        .brand {

            color: #38bdf8;

        }


        /* =========================
           NOTES GRID
        ========================= */

        .notes-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 24px;

        }


        /* =========================
           NOTE CARD
        ========================= */

        .note-card {

            background: #0d121d;

            border: 1px solid #1f2937;

            border-radius: 8px;

            min-height: 300px;

            padding: 24px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;

        }


        .note-card:hover {

            transform: translateY(-5px);

            border-color: #38bdf8;

            background: #111827;

        }


        /* =========================
           ICON CIRCLE
        ========================= */

        .icon-box {

            width: 128px;

            height: 128px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 22px;

            font-size: 65px;

        }


        /* Python */

        .python-icon {

            background: #3776ab;

            color: #ffd343;

        }


        /* HTML */

        .html-icon {

            background: #e44d26;

            color: #ffffff;

        }


        /* =========================
           CARD TITLE
        ========================= */

        .note-card h2 {

            font-size: 1.1rem;

            margin-bottom: 12px;

            font-weight: 700;

        }


        .note-card p {

            color: #9ca3af;

            font-size: 0.9rem;

            margin-bottom: 22px;

        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-btn {

            margin-top: auto;

            width: 100%;

            padding: 11px 15px;

            border: none;

            border-radius: 6px;

            background: #202a3a;

            color: #ffffff;

            font-size: 0.9rem;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.2s ease;

        }


        .open-btn:hover {

            background: #2c3a50;

        }


        /* =========================
           PDF VIEWER
        ========================= */

        .pdf-viewer {

            display: none;

            margin-top: 45px;

            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 12px;

            padding: 20px;

        }


        .pdf-viewer.active {

            display: block;

        }


        /* PDF HEADER */

        .pdf-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }


        .pdf-title {

            font-size: 1.25rem;

            font-weight: 700;

        }


        .close-btn {

            border: 1px solid #374151;

            background: transparent;

            color: #ffffff;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

        }


        .close-btn:hover {

            background: #1f2937;

        }


        /* PDF FRAME */

        .pdf-frame {

            width: 100%;

            height: 700px;

            border: 1px solid #374151;

            border-radius: 8px;

            background: #000000;

        }


        /* =========================
           DOWNLOAD BUTTON
        ========================= */

        .download-area {

            margin-top: 18px;

        }


        .download-btn {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            width: 100%;

            padding: 14px;

            background: #202a3a;

            color: #ffffff;

            text-decoration: none;

            border-radius: 7px;

            font-weight: 600;

            transition: background 0.2s ease;

        }


        .download-btn:hover {

            background: #2c3a50;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .notes-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            body {

                padding: 25px 12px;

            }


            .page-header h1 {

                font-size: 1.8rem;

            }


            .notes-grid {

                grid-template-columns: 1fr;

            }


            .note-card {

                min-height: 290px;

            }


            .pdf-frame {

                height: 550px;

            }


            .pdf-header {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         PAGE HEADER
    ========================= -->

    <div class="page-header">

        <h1>
            <span class="brand">Ahsan Web Studio</span>
            Notes
        </h1>

        <p>
            Download and read my programming notes
        </p>

    </div>



    <!-- =========================
         NOTES CARDS
    ========================= -->

    <div class="notes-grid">


        <!-- =====================
             PYTHON CARD
        ====================== -->

        <div
            class="note-card"
            onclick="openPDF(
                'Python Crash Course',
                'Python-Crash-Course.pdf'
            )">


            <div class="icon-box python-icon">

                <i class="fa-brands fa-python"></i>

            </div>


            <h2>
                Python Crash Course
            </h2>


            <p>
                Download Python Crash Course Notes
            </p>


            <button
                class="open-btn"
                onclick="event.stopPropagation(); openPDF(
                    'Python Crash Course',
                    'Python-Crash-Course.pdf'
                )">

                Open PDF

            </button>


        </div>



        <!-- =====================
             HTML CARD
        ====================== -->

        <div
            class="note-card"
            onclick="openPDF(
                'HTML Basic Notes',
                'HTML_Detailed_English_Notes_Ahsan_Web_Studio.pdf'
            )">


            <div class="icon-box html-icon">

                <i class="fa-brands fa-html5"></i>

            </div>


            <h2>
                HTML Basic Notes
            </h2>


            <p>
                Download Basic HTML Notes
            </p>


            <button
                class="open-btn"
                onclick="event.stopPropagation(); openPDF(
                    'HTML Basic Notes',
                    'HTML_Detailed_English_Notes_Ahsan_Web_Studio.pdf'
                )">

                Open PDF

            </button>


        </div>


    </div>



    <!-- =========================
         PDF VIEWER
    ========================= -->

    <div
        class="pdf-viewer"
        id="pdfViewer">


        <div class="pdf-header">


            <div
                class="pdf-title"
                id="pdfTitle">

                PDF Notes

            </div>


            <button
                class="close-btn"
                onclick="closePDF()">

                <i class="fa-solid fa-xmark"></i>

                Close

            </button>


        </div>


        <!-- PDF -->

        <iframe
            class="pdf-frame"
            id="pdfFrame"
            src=""
            title="PDF Viewer">
        </iframe>


        <!-- DOWNLOAD -->

        <div class="download-area">

            <a
                id="downloadButton"
                class="download-btn"
                href=""
                download>

                <i class="fa-solid fa-download"></i>

                <span id="downloadText">
                    Download PDF
                </span>

            </a>

        </div>


    </div>


</div>



<script>


    /* =========================
       OPEN PDF
    ========================= */

    function openPDF(title, file) {


        const viewer =
            document.getElementById("pdfViewer");


        const frame =
            document.getElementById("pdfFrame");


        const pdfTitle =
            document.getElementById("pdfTitle");


        const downloadButton =
            document.getElementById("downloadButton");


        const downloadText =
            document.getElementById("downloadText");


        /* Set title */

        pdfTitle.textContent = title;


        /* Open PDF */

        frame.src = file;


        /* Download link */

        downloadButton.href = file;


        /* Set download title */

        if (title === "HTML Basic Notes") {

            downloadText.textContent =
                "Download Basic Notes";

        }

        else {

            downloadText.textContent =
                "Download Python Crash Course";

        }


        /* Show viewer */

        viewer.classList.add("active");


        /* Scroll to PDF */

        setTimeout(function () {

            viewer.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }, 100);

    }



    /* =========================
       CLOSE PDF
    ========================= */

    function closePDF() {


        const viewer =
            document.getElementById("pdfViewer");


        const frame =
            document.getElementById("pdfFrame");


        frame.src = "";


        viewer.classList.remove("active");

    }


</script>


</body>

</html>
