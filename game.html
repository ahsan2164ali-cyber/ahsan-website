<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>🧱 Ahsan Brick Breaker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}

body{
  touch-action:none;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#172554,#020617 65%);
}

/* TOP BAR */

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;

  height:72px;

  padding:10px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(2,6,23,.82);

  border-bottom:1px solid rgba(255,255,255,.1);

  backdrop-filter:blur(12px);

  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#38bdf8;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  min-width:75px;
  padding:7px 10px;

  text-align:center;

  border-radius:10px;

  background:#0f172a;

  border:1px solid #263449;
}

.stat small{
  display:block;
  color:#94a3b8;
  font-size:9px;
}

.stat strong{
  font-size:16px;
}

/* CANVAS */

canvas{
  position:absolute;

  left:50%;
  top:72px;

  transform:translateX(-50%);

  display:block;

  background:
    linear-gradient(
      rgba(15,23,42,.4),
      rgba(2,6,23,.85)
    );

  box-shadow:
    0 0 80px rgba(56,189,248,.08);
}

/* CONTROLS */

.controls{
  position:absolute;

  bottom:18px;

  left:0;
  right:0;

  display:flex;

  justify-content:center;

  gap:15px;

  z-index:30;
}

.control{
  width:65px;
  height:50px;

  border-radius:14px;

  border:1px solid #334155;

  background:rgba(15,23,42,.9);

  color:white;

  font-size:20px;

  cursor:pointer;
}

.control:active{
  transform:scale(.94);
  background:#2563eb;
}

.pause{
  width:90px;
}

/* START */

.overlay{
  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:20px;

  background:rgba(2,6,23,.8);

  backdrop-filter:blur(8px);
}

.panel{
  width:min(480px,100%);

  padding:35px 25px;

  border-radius:24px;

  background:#0f172a;

  border:1px solid rgba(56,189,248,.25);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55);
}

.panel h1{
  font-size:38px;

  margin-bottom:12px;

  background:
    linear-gradient(90deg,#38bdf8,#818cf8);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.panel p{
  color:#94a3b8;

  line-height:1.7;

  margin-bottom:24px;
}

.start-btn{
  width:100%;

  padding:15px;

  border:0;

  border-radius:12px;

  background:#2563eb;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}

.start-btn:hover{
  background:#1d4ed8;
}

/* MOBILE */

@media(max-width:600px){

  .topbar{
    height:64px;
    padding:8px 10px;
  }

  canvas{
    top:64px;
  }

  .logo{
    font-size:15px;
  }

  .stats{
    gap:5px;
  }

  .stat{
    min-width:55px;
    padding:6px;
  }

  .stat strong{
    font-size:13px;
  }

  .controls{
    bottom:10px;
  }

  .control{
    width:58px;
    height:48px;
  }

  .pause{
    width:75px;
  }

  .panel h1{
    font-size:31px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="logo">
      🧱 AHSAN BREAKER
    </div>

    <div class="stats">

      <div class="stat">
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <small>COINS</small>
        <strong id="coins">0</strong>
      </div>

      <div class="stat">
        <small>LEVEL</small>
        <strong id="level">1</strong>
      </div>

      <div class="stat">
        <small>LIVES</small>
        <strong id="lives">3</strong>
      </div>

    </div>

  </div>

  <!-- GAME CANVAS -->

  <canvas id="canvas"></canvas>

  <!-- CONTROLS -->

  <div class="controls">

    <button class="control" id="leftBtn">
      ◀
    </button>

    <button class="control pause" id="pauseBtn">
      ⏸ PAUSE
    </button>

    <button class="control" id="rightBtn">
      ▶
    </button>

  </div>

  <!-- START / GAME OVER -->

  <div class="overlay" id="overlay">

    <div class="panel">

      <h1 id="title">
        🧱 BRICK BREAKER
      </h1>

      <p id="message">
        Break every brick, collect coins and
        survive as many levels as possible.
        <br><br>
        Use ◀ ▶ or your keyboard to move the paddle.
      </p>

      <button
        class="start-btn"
        id="startBtn"
      >
        🚀 START GAME
      </button>

    </div>

  </div>

</div>

<script>

/* =====================================================
   AHSAN BRICK BREAKER
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const levelEl =
  document.getElementById("level");

const livesEl =
  document.getElementById("lives");

const overlay =
  document.getElementById("overlay");

const title =
  document.getElementById("title");

const message =
  document.getElementById("message");

const startBtn =
  document.getElementById("startBtn");

const pauseBtn =
  document.getElementById("pauseBtn");

let W;
let H;

let running = false;
let paused = false;

let score = 0;
let coins = 0;
let lives = 3;
let level = 1;

/* PADDLE */

const paddle = {
  width:95,
  height:13,
  x:0,
  y:0,
  speed:8
};

/* BALL */

const ball = {
  x:0,
  y:0,
  radius:8,
  dx:4,
  dy:-4
};

/* BRICKS */

let bricks = [];

let rows = 5;
let cols = 7;

let brickWidth;
let brickHeight = 25;
let brickGap = 7;

/* INPUT */

let leftPressed = false;
let rightPressed = false;

/* POWERUPS */

let powerups = [];

/* AUDIO */

let audio = null;


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const maxWidth =
    Math.min(
      window.innerWidth,
      900
    );

  const maxHeight =
    window.innerHeight - 150;

  W = maxWidth;
  H = Math.max(
    450,
    maxHeight
  );

  canvas.width = W;
  canvas.height = H;

  paddle.y =
    H - 55;

  paddle.x =
    W/2 -
    paddle.width/2;

  if(!running){
    resetBall();
  }
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   AUDIO
===================================================== */

function sound(type){

  try{

    if(!audio){

      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();

    osc.connect(gain);

    gain.connect(
      audio.destination
    );

    if(type==="brick"){

      osc.frequency.value=520;

    }else if(type==="coin"){

      osc.frequency.value=850;

    }else if(type==="lose"){

      osc.frequency.value=130;

    }else{

      osc.frequency.value=300;

    }

    gain.gain.value=.04;

    osc.start();

    osc.stop(
      audio.currentTime+.07
    );

  }catch(e){}

}


/* =====================================================
   RESET BALL
===================================================== */

function resetBall(){

  ball.x =
    W/2;

  ball.y =
    H-80;

  ball.dx =
    (Math.random()>.5 ? 1 : -1)
    * (3.5 + level*.25);

  ball.dy =
    -(4 + level*.25);
}


/* =====================================================
   CREATE BRICKS
===================================================== */

function createBricks(){

  bricks=[];

  cols =
    Math.min(
      7 + Math.floor(level/3),
      10
    );

  rows =
    Math.min(
      4 + level,
      8
    );

  brickWidth =
    (
      W -
      40 -
      (cols-1)*brickGap
    ) / cols;

  const colors=[
    "#38bdf8",
    "#818cf8",
    "#a78bfa",
    "#c084fc",
    "#f472b6",
    "#fb7185",
    "#f59e0b",
    "#22c55e"
  ];

  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      bricks.push({

        x:
          20 +
          c*(brickWidth+brickGap),

        y:
          35 +
          r*(brickHeight+brickGap),

        width:
          brickWidth,

        height:
          brickHeight,

        alive:true,

        color:
          colors[
            r % colors.length
          ],

        hits:
          level >= 5 && r < 2
          ? 2
          : 1

      });

    }

  }

}


/* =====================================================
   START
===================================================== */

function startGame(){

  score=0;
  coins=0;
  lives=3;
  level=1;

  updateHUD();

  createBricks();

  resetBall();

  powerups=[];

  running=true;
  paused=false;

  overlay.style.display="none";

  pauseBtn.textContent =
    "⏸ PAUSE";

  sound("start");

  requestAnimationFrame(loop);

}


/* =====================================================
   UPDATE HUD
===================================================== */

function updateHUD(){

  scoreEl.textContent =
    score;

  coinsEl.textContent =
    coins;

  levelEl.textContent =
    level;

  livesEl.textContent =
    lives;

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  /* stars */

  for(
    let i=0;
    i<35;
    i++
  ){

    const x =
      (i*83)%W;

    const y =
      (i*47)%H;

    ctx.fillStyle =
      "rgba(255,255,255,.16)";

    ctx.fillRect(
      x,
      y,
      2,
      2
    );

  }

}


/* =====================================================
   DRAW BRICKS
===================================================== */

function drawBricks(){

  bricks.forEach(
    brick=>{

      if(!brick.alive)
        return;

      ctx.save();

      ctx.shadowBlur=12;
      ctx.shadowColor=
        brick.color;

      ctx.fillStyle =
        brick.color;

      roundRect(
        ctx,
        brick.x,
        brick.y,
        brick.width,
        brick.height,
        7
      );

      ctx.fill();

      ctx.shadowBlur=0;

      /* shine */

      ctx.fillStyle =
        "rgba(255,255,255,.25)";

      roundRect(
        ctx,
        brick.x+3,
        brick.y+3,
        brick.width-6,
        4,
        3
      );

      ctx.fill();

      if(brick.hits>1){

        ctx.fillStyle="white";

        ctx.font="bold 10px Arial";

        ctx.textAlign="center";

        ctx.fillText(
          "×2",
          brick.x+brick.width/2,
          brick.y+17
        );

      }

      ctx.restore();

    }
  );

}


/* =====================================================
   DRAW PADDLE
===================================================== */

function drawPaddle(){

  ctx.save();

  ctx.shadowBlur=20;

  ctx.shadowColor=
    "#38bdf8";

  const gradient =
    ctx.createLinearGradient(
      paddle.x,
      paddle.y,
      paddle.x+paddle.width,
      paddle.y
    );

  gradient.addColorStop(
    0,
    "#2563eb"
  );

  gradient.addColorStop(
    .5,
    "#38bdf8"
  );

  gradient.addColorStop(
    1,
    "#6366f1"
  );

  ctx.fillStyle =
    gradient;

  roundRect(
    ctx,
    paddle.x,
    paddle.y,
    paddle.width,
    paddle.height,
    8
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   DRAW BALL
===================================================== */

function drawBall(){

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.shadowBlur=20;

  ctx.shadowColor =
    "#38bdf8";

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   DRAW POWERUPS
===================================================== */

function drawPowerups(){

  powerups.forEach(
    p=>{

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        12,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        p.type==="coin"
        ? "#facc15"
        : "#22c55e";

      ctx.shadowBlur=15;

      ctx.shadowColor =
        ctx.fillStyle;

      ctx.fill();

      ctx.fillStyle =
        "#020617";

      ctx.font =
        "bold 12px Arial";

      ctx.textAlign="center";

      ctx.textBaseline="middle";

      ctx.fillText(
        p.type==="coin"
        ? "$"
        : "+",
        p.x,
        p.y
      );

      ctx.restore();

    }
  );

}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
  context,
  x,
  y,
  width,
  height,
  radius
){

  context.beginPath();

  context.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

}


/* =====================================================
   MOVE PADDLE
===================================================== */

function movePaddle(){

  if(leftPressed){

    paddle.x -=
      paddle.speed;

  }

  if(rightPressed){

    paddle.x +=
      paddle.speed;

  }

  if(
    paddle.x < 0
  ){

    paddle.x=0;

  }

  if(
    paddle.x+paddle.width > W
  ){

    paddle.x =
      W-paddle.width;

  }

}


/* =====================================================
   BALL
===================================================== */

function moveBall(){

  ball.x +=
    ball.dx;

  ball.y +=
    ball.dy;

  /* WALL */

  if(
    ball.x-ball.radius <= 0 ||
    ball.x+ball.radius >= W
  ){

    ball.dx *= -1;

    sound("wall");

  }

  if(
    ball.y-ball.radius <= 0
  ){

    ball.dy *= -1;

    sound("wall");

  }

  /* PADDLE */

  if(

    ball.y+ball.radius >=
      paddle.y &&

    ball.y-ball.radius <=
      paddle.y+paddle.height &&

    ball.x >= paddle.x &&

    ball.x <=
      paddle.x+paddle.width &&

    ball.dy > 0

  ){

    const hit =
      (
        ball.x -
        (
          paddle.x+
          paddle.width/2
        )
      )
      /
      (paddle.width/2);

    ball.dx =
      hit * 6;

    ball.dy =
      -Math.abs(ball.dy);

    sound("wall");

  }

  /* BOTTOM */

  if(
    ball.y >
    H+30
  ){

    lives--;

    updateHUD();

    sound("lose");

    if(lives<=0){

      gameOver();

    }else{

      resetBall();

    }

  }

}


/* =====================================================
   BRICK COLLISION
===================================================== */

function brickCollision(){

  for(
    let i=0;
    i<bricks.length;
    i++
  ){

    const brick =
      bricks[i];

    if(!brick.alive)
      continue;

    if(

      ball.x+ball.radius >
        brick.x &&

      ball.x-ball.radius <
        brick.x+brick.width &&

      ball.y+ball.radius >
        brick.y &&

      ball.y-ball.radius <
        brick.y+brick.height

    ){

      ball.dy *= -1;

      brick.hits--;

      score +=
        brick.hits<=0
        ? 10*level
        : 5;

      sound("brick");

      if(brick.hits<=0){

        brick.alive=false;

        /* chance of powerup */

        if(
          Math.random()<.16
        ){

          powerups.push({

            x:
              brick.x+
              brick.width/2,

            y:
              brick.y+
              brick.height/2,

            type:
              Math.random()<.55
              ? "coin"
              : "life"

          });

        }

      }

      updateHUD();

      break;

    }

  }

}


/* =====================================================
   POWERUPS
===================================================== */

function movePowerups(){

  powerups.forEach(
    p=>{

      p.y += 2.8;

      if(

        p.y+12 >=
          paddle.y &&

        p.y-12 <=
          paddle.y+
          paddle.height &&

        p.x >= paddle.x &&

        p.x <=
          paddle.x+
          paddle.width

      ){

        if(p.type==="coin"){

          coins++;

          score+=25;

        }else{

          lives++;

        }

        sound("coin");

        p.collected=true;

        updateHUD();

      }

    }
  );

  powerups =
    powerups.filter(
      p =>
        !p.collected &&
        p.y < H+30
    );

}


/* =====================================================
   LEVEL CHECK
===================================================== */

function checkLevel(){

  const remaining =
    bricks.filter(
      b=>b.alive
    ).length;

  if(remaining===0){

    level++;

    score +=
      100*level;

    createBricks();

    resetBall();

    updateHUD();

    sound("coin");

  }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running=false;

  title.textContent =
    "💥 GAME OVER";

  message.innerHTML =
    `
      Final Score:
      <strong>${score}</strong>
      <br><br>
      Coins Collected:
      <strong>${coins}</strong>
      <br><br>
      Level Reached:
      <strong>${level}</strong>
    `;

  startBtn.textContent =
    "🔄 PLAY AGAIN";

  overlay.style.display =
    "flex";

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!running)
    return;

  paused=!paused;

  pauseBtn.textContent =
    paused
    ? "▶ PLAY"
    : "⏸ PAUSE";

  if(!paused){

    requestAnimationFrame(loop);

  }

}


/* =====================================================
   LOOP
===================================================== */

function loop(){

  if(!running || paused)
    return;

  drawBackground();

  movePaddle();

  moveBall();

  brickCollision();

  movePowerups();

  drawBricks();

  drawPowerups();

  drawPaddle();

  drawBall();

  checkLevel();

  requestAnimationFrame(loop);

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      leftPressed=true;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      rightPressed=true;

    }

    if(
      e.code==="Space"
    ){

      e.preventDefault();

      togglePause();

    }

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      leftPressed=false;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      rightPressed=false;

    }

  }
);


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function holdButton(
  element,
  start,
  end
){

  element.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      start();
    }
  );

  element.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      end();
    }
  );

  element.addEventListener(
    "pointercancel",
    end
  );

  element.addEventListener(
    "pointerleave",
    end
  );

}

holdButton(
  document.getElementById("leftBtn"),
  ()=>leftPressed=true,
  ()=>leftPressed=false
);

holdButton(
  document.getElementById("rightBtn"),
  ()=>rightPressed=true,
  ()=>rightPressed=false
);


/* =====================================================
   BUTTONS
===================================================== */

startBtn.addEventListener(
  "click",
  startGame
);

pauseBtn.addEventListener(
  "click",
  togglePause
);

</script>

</body>
</html>
