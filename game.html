<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ball Catch Game | Ahsan Web Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050b18;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

header{
  height:70px;
  background:#0f172a;
  border-bottom:1px solid #1e293b;

  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}

  color:#38bdf8;
  font-size:23px;
  font-weight:bold;
}

  color:white;
  text-decoration:none;

  padding:10px 17px;
  border-radius:8px;
}

  height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.game-box{
  position:relative;
  width:min(900px,100%);
  height:min(650px,calc(100vh - 110px));
  background:
    radial-gradient(circle at 50% 20%,#172554,#050b18 65%);
  border:2px solid #1e40af;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 50px rgba(37,99,235,.25);
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;

<body>

<header>
  <div class="logo">🎮 Ahsan Web Studio</div>
  <a href="index.html" class="back">← Home</a>
</header>

<div class="game-wrapper">

  <div class="game-box">

    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="hud-box">
        🏆 Score: <span id="score">0</span>
      </div>

      <div class="hud-box">
        🪙 Coins: <span id="coins">0</span>
      </div>
    </div>

    <div class="start-screen" id="startScreen">

      <h1>🎯 Ball Catch</h1>

      <p>
        Move the platform quickly and catch the falling balls!
      </p>

      <button onclick="startGame()">
        ▶ Start Game
      </button>

    </div>

    <div class="game-over" id="gameOver">

      <h1>Game Over</h1>

      <p>
        Your Score:
        <strong id="finalScore">0</strong>
      </p>

      <button onclick="restartGame()">
        🔄 Play Again
      </button>

    </div>

    <div class="controls">

      <button
        class="control"
        id="leftBtn"
      >◀</button>

      <button
        class="control"
        id="rightBtn"
      >▶</button>

    </div>

  </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resizeCanvas(){

  const rect = canvas.getBoundingClientRect();

  width = canvas.width = rect.width;
  height = canvas.height = rect.height;

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


/* GAME VARIABLES */

let player;
let ball;

let score = 0;
let coins = 0;

let gameRunning = false;

let leftPressed = false;
let rightPressed = false;


/*
  FAST PLAYER MOVEMENT
  Increase this number if you want
  the platform even faster.
*/

const PLAYER_SPEED = 850;


/* PLAYER */

function createPlayer(){

  player = {

    width:110,
    height:18,

    x:width / 2 - 55,

    y:height - 75

  };

}


/* BALL */

function createBall(){

  ball = {

    radius:13,

    x:
      Math.random() *
      (width - 26) + 13,

    y:-20,

    speed:260 + Math.random()*100

  };

}


/* DRAW PLAYER */

function drawPlayer(){

  const gradient =
    ctx.createLinearGradient(
      player.x,
      player.y,
      player.x,
      player.y + player.height
    );

  gradient.addColorStop(0,"#38bdf8");
  gradient.addColorStop(1,"#2563eb");

  ctx.fillStyle = gradient;

  ctx.shadowColor = "#38bdf8";
  ctx.shadowBlur = 15;

  ctx.beginPath();

  ctx.roundRect(
    player.x,
    player.y,
    player.width,
    player.height,
    8
  );

  ctx.fill();

  ctx.shadowBlur = 0;

}


/* DRAW BALL */

function drawBall(){

  const gradient =
    ctx.createRadialGradient(
      ball.x - 4,
      ball.y - 4,
      2,
      ball.x,
      ball.y,
      ball.radius
    );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(.25,"#facc15");
  gradient.addColorStop(1,"#f97316");

  ctx.fillStyle = gradient;

  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 20;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

}


/* BACKGROUND */

function drawBackground(){

  ctx.clearRect(0,0,width,height);

  /* stars */

  for(let i=0;i<35;i++){

    const x =
      (i * 97) % width;

    const y =
      (i * 53) % height;

    ctx.fillStyle =
      "rgba(255,255,255,.25)";

    ctx.fillRect(x,y,2,2);

  }

}


/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    leftPressed=true;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    rightPressed=true;
  }

});

document.addEventListener("keyup",(e)=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    leftPressed=false;
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    rightPressed=false;
  }

});


/* MOBILE BUTTONS */

function holdButton(button, direction){

  button.addEventListener("pointerdown",(e)=>{

    e.preventDefault();

    if(direction==="left"){
      leftPressed=true;
    }else{
      rightPressed=true;
    }

  });

  button.addEventListener("pointerup",()=>{

    if(direction==="left"){
      leftPressed=false;
    }else{
      rightPressed=false;
    }

  });

  button.addEventListener("pointerleave",()=>{

    if(direction==="left"){
      leftPressed=false;
    }else{
      rightPressed=false;
    }

  });

}

holdButton(
  document.getElementById("leftBtn"),
  "left"
);

holdButton(
  document.getElementById("rightBtn"),
  "right"
);


/* GAME UPDATE */

let lastTime=0;

function update(time){

  if(!gameRunning){
    requestAnimationFrame(update);
    return;
  }

  const delta =
    Math.min(
      (time-lastTime)/1000,
      .04
    );

  lastTime=time;


  /* PLAYER MOVEMENT */

  if(leftPressed){

    player.x -=
      PLAYER_SPEED * delta;

  }

  if(rightPressed){

    player.x +=
      PLAYER_SPEED * delta;

  }


  /* KEEP PLAYER INSIDE */

  if(player.x<0){
    player.x=0;
  }

  if(
    player.x + player.width > width
  ){

    player.x =
      width - player.width;

  }


  /* BALL */

  ball.y +=
    ball.speed * delta;


  /* CATCH */

  if(

    ball.y + ball.radius >= player.y &&

    ball.x >= player.x &&

    ball.x <= player.x + player.width

  ){

    score++;

    coins++;

    document.getElementById(
      "score"
    ).textContent=score;

    document.getElementById(
      "coins"
    ).textContent=coins;

    createBall();

    /*
      Gradually increase difficulty
    */

    ball.speed +=
      Math.min(score * 3,120);

  }


  /* MISS */

  if(ball.y-ball.radius>height){

    endGame();

    return;

  }


  drawBackground();

  drawPlayer();

  drawBall();

  requestAnimationFrame(update);

}


/* START */

function startGame(){

  score=0;
  coins=0;

  document.getElementById(
    "score"
  ).textContent=0;

  document.getElementById(
    "coins"
  ).textContent=0;

  document.getElementById(
    "startScreen"
  ).style.display="none";

  document.getElementById(
    "gameOver"
  ).style.display="none";

  createPlayer();

  createBall();

  gameRunning=true;

  lastTime=performance.now();

  requestAnimationFrame(update);

}


/* GAME OVER */

function endGame(){

  gameRunning=false;

  document.getElementById(
    "finalScore"
  ).textContent=score;

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* RESTART */

function restartGame(){

  document.getElementById(
    "gameOver"
  ).style.display="none";

  startGame();

}


/* INITIAL */

createPlayer();
createBall();

drawBackground();
drawPlayer();
drawBall();

</script>

</body>
</html>
