<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ahsan Racing | Street Rush</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#05070c;
  color:white;
}

body{
  touch-action:none;
}

/* =========================
   GAME
========================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      #78b7d8 0%,
      #d6c18b 18%,
      #4d5444 19%,
      #20252b 100%
    );
}

/* SKY */

.sky{
  position:absolute;
  inset:0 0 auto 0;
  height:25%;
  background:
    radial-gradient(circle at 72% 28%,rgba(255,255,220,.8),transparent 8%),
    linear-gradient(#82c2e0,#d9c58d);
  z-index:0;
}

/* ROAD */

#road{
  position:absolute;
  left:50%;
  top:17%;
  width:min(720px,100vw);
  height:83%;
  transform:translateX(-50%);
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #333 0%,
      #1e2227 7%,
      #15191e 15%,
      #191d22 50%,
      #15191e 85%,
      #1e2227 93%,
      #333 100%
    );

  border-left:12px solid #c9c9c9;
  border-right:12px solid #c9c9c9;

  box-shadow:
    0 0 40px rgba(0,0,0,.5);
}

/* ROAD EDGE */

#road::before,
#road::after{
  content:"";
  position:absolute;
  top:0;
  width:7px;
  height:100%;
  background:
    repeating-linear-gradient(
      to bottom,
      #ffffff 0 40px,
      #e73535 40px 80px
    );
  z-index:2;
}

#road::before{
  left:0;
}

#road::after{
  right:0;
}

/* LANE LINES */

.lane-line{
  position:absolute;
  top:-150px;
  width:6px;
  height:110px;
  background:rgba(255,255,255,.85);
  border-radius:4px;
  box-shadow:0 0 5px rgba(255,255,255,.3);
  z-index:2;
}

.lane1{
  left:33.33%;
}

.lane2{
  left:66.66%;
}

/* SCENERY */

.scenery{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.tree{
  position:absolute;
  width:45px;
  height:70px;
}

.tree::before{
  content:"";
  position:absolute;
  width:42px;
  height:42px;
  left:1px;
  top:0;
  border-radius:50%;
  background:#1d522c;
  box-shadow:
    15px 10px 0 #28643a,
    -10px 15px 0 #214f2f;
}

.tree::after{
  content:"";
  position:absolute;
  width:9px;
  height:32px;
  left:18px;
  top:38px;
  background:#5b3822;
}

/* =========================
   CARS
========================= */

.car{
  position:absolute;
  width:74px;
  height:138px;
  border-radius:18px 18px 12px 12px;
  transform:translateX(-50%);
  z-index:10;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.45));
}

.car-body{
  position:absolute;
  inset:0;
  border-radius:18px 18px 12px 12px;
  overflow:hidden;
}

.car-body::before{
  content:"";
  position:absolute;
  left:12%;
  top:12%;
  width:76%;
  height:35%;
  border-radius:18px 18px 8px 8px;
  background:
    linear-gradient(
      135deg,
      #bfe7ff,
      #1b3850 55%,
      #0b1520
    );
  border:2px solid rgba(255,255,255,.25);
}

.car-body::after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:12%;
  height:30%;
  border-radius:10px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.12),
      transparent
    );
}

/* wheels */

.wheel{
  position:absolute;
  width:13px;
  height:37px;
  background:#08090b;
  border-radius:8px;
  z-index:-1;
}

.wheel.left{
  left:-6px;
}

.wheel.right{
  right:-6px;
}

.wheel.top{
  top:22px;
}

.wheel.bottom{
  bottom:20px;
}

/* player */

#player{
  position:absolute;
  width:82px;
  height:150px;
  bottom:7%;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  filter:drop-shadow(0 16px 10px rgba(0,0,0,.55));
}

.player-body{
  position:absolute;
  inset:0;
  border-radius:20px 20px 13px 13px;
  overflow:hidden;

  background:
    linear-gradient(
      100deg,
      #071018,
      #283944 25%,
      #8ea4ac 48%,
      #26353d 72%,
      #05090c
    );

  border:1px solid rgba(255,255,255,.35);

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.12),
    0 0 15px rgba(0,0,0,.5);
}

.player-body::before{
  content:"";
  position:absolute;
  left:12%;
  top:10%;
  width:76%;
  height:38%;
  border-radius:20px 20px 8px 8px;

  background:
    linear-gradient(
      135deg,
      #dff5ff,
      #416577 35%,
      #07121c 80%
    );

  border:2px solid rgba(255,255,255,.3);
}

.player-body::after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  bottom:8%;
  height:25%;
  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #26343b,
      #050607
    );
}

.player-light{
  position:absolute;
  width:16px;
  height:7px;
  top:8px;
  border-radius:8px;
  background:#f8ffff;
  box-shadow:0 0 10px white;
  z-index:4;
}

.player-light.left{
  left:11px;
}

.player-light.right{
  right:11px;
}

.player-wheel{
  position:absolute;
  width:14px;
  height:40px;
  background:#050608;
  border-radius:8px;
  z-index:-1;
}

.player-wheel.left{
  left:-6px;
}

.player-wheel.right{
  right:-6px;
}

.player-wheel.top{
  top:25px;
}

.player-wheel.bottom{
  bottom:22px;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.hud-left,
.hud-right{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hud-box{
  min-width:105px;
  padding:9px 13px;
  border-radius:12px;
  background:rgba(4,8,15,.78);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.hud-label{
  display:block;
  color:#9ca3af;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.hud-value{
  font-size:21px;
  font-weight:bold;
  color:#fff;
}

#coins{
  color:#ffd54a;
}

#speed{
  color:#55d6ff;
}

/* =========================
   SPEEDOMETER
========================= */

#speedometer{
  position:absolute;
  right:22px;
  bottom:24px;
  width:150px;
  height:150px;
  border-radius:50%;
  z-index:90;

  background:
    radial-gradient(
      circle,
      #101722 0 54%,
      #05080e 55% 100%
    );

  border:5px solid #334155;

  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 0 25px rgba(255,255,255,.05);
}

.speed-mark{
  position:absolute;
  inset:9px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.25);
}

.speed-number{
  position:absolute;
  left:0;
  right:0;
  top:45px;
  text-align:center;
}

.speed-number strong{
  display:block;
  font-size:32px;
}

.speed-number span{
  color:#94a3b8;
  font-size:10px;
  letter-spacing:2px;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  left:20px;
  right:190px;
  bottom:25px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  pointer-events:none;
}

.control-group{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.control-btn{
  width:65px;
  height:65px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.18);

  background:rgba(5,10,18,.78);
  color:white;

  font-size:26px;
  font-weight:bold;

  box-shadow:
    0 8px 20px rgba(0,0,0,.3);

  backdrop-filter:blur(8px);
  user-select:none;
  cursor:pointer;
}

.control-btn:active{
  transform:scale(.92);
  background:#2563eb;
}

.brake{
  border-color:rgba(239,68,68,.5);
}

.gas{
  border-color:rgba(34,197,94,.5);
}

/* =========================
   START SCREEN
========================= */

#startScreen,
#gameOver{
  position:absolute;
  inset:0;
  z-index:500;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(37,99,235,.16),
      rgba(0,0,0,.9) 65%
    );

  backdrop-filter:blur(5px);
}

.modal{
  width:min(500px,90%);
  padding:35px 28px;
  text-align:center;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(17,24,39,.97),
      rgba(5,10,18,.97)
    );

  border:1px solid rgba(56,189,248,.25);

  box-shadow:
    0 30px 100px rgba(0,0,0,.6);
}

.modal .emoji{
  font-size:58px;
  margin-bottom:10px;
}

.modal h1{
  font-size:38px;
  margin-bottom:8px;
}

.modal h1 span{
  color:#38bdf8;
}

.modal p{
  color:#94a3b8;
  line-height:1.7;
  margin-bottom:20px;
}

.instructions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:20px 0;
}

.instruction{
  padding:12px;
  background:#0f172a;
  border-radius:12px;
  color:#cbd5e1;
  font-size:13px;
}

.main-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#2563eb,#38bdf8);
  color:white;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

.main-btn:hover{
  filter:brightness(1.12);
  transform:translateY(-2px);
}

/* hidden */

.hidden{
  display:none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  #road{
    width:100vw;
    border-left-width:7px;
    border-right-width:7px;
  }

  #hud{
    top:8px;
    left:8px;
    right:8px;
  }

  .hud-box{
    min-width:82px;
    padding:7px 9px;
  }

  .hud-value{
    font-size:17px;
  }

  #speedometer{
    width:105px;
    height:105px;
    right:12px;
    bottom:115px;
  }

  .speed-number{
    top:30px;
  }

  .speed-number strong{
    font-size:23px;
  }

  #controls{
    left:12px;
    right:12px;
    bottom:18px;
  }

  .control-btn{
    width:58px;
    height:58px;
  }

  #player{
    width:70px;
    height:130px;
  }

  .car{
    width:62px;
    height:115px;
  }

  .modal h1{
    font-size:30px;
  }

  .instructions{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>

  <div class="scenery" id="scenery"></div>

  <div id="road">

    <div class="lane-line lane1"></div>
    <div class="lane-line lane2"></div>

    <div id="traffic"></div>

    <!-- PLAYER -->

    <div id="player">

      <div class="player-wheel left top"></div>
      <div class="player-wheel right top"></div>
      <div class="player-wheel left bottom"></div>
      <div class="player-wheel right bottom"></div>

      <div class="player-body">

        <div class="player-light left"></div>
        <div class="player-light right"></div>

      </div>

    </div>

  </div>


  <!-- HUD -->

  <div id="hud">

    <div class="hud-left">

      <div class="hud-box">
        <span class="hud-label">Distance</span>
        <span class="hud-value" id="distance">0 m</span>
      </div>

      <div class="hud-box">
        <span class="hud-label">Coins</span>
        <span class="hud-value" id="coins">0</span>
      </div>

    </div>


    <div class="hud-right">

      <div class="hud-box">
        <span class="hud-label">Speed</span>
        <span class="hud-value" id="speed">0 km/h</span>
      </div>

    </div>

  </div>


  <!-- SPEEDOMETER -->

  <div id="speedometer">

    <div class="speed-mark"></div>

    <div class="speed-number">
      <strong id="dialSpeed">0</strong>
      <span>KM/H</span>
    </div>

  </div>


  <!-- CONTROLS -->

  <div id="controls">

    <div class="control-group">

      <button class="control-btn"
        id="leftBtn">
        ←
      </button>

      <button class="control-btn"
        id="rightBtn">
        →
      </button>

    </div>


    <div class="control-group">

      <button class="control-btn brake"
        id="brakeBtn">
        🛑
      </button>

      <button class="control-btn gas"
        id="gasBtn">
        ⚡
      </button>

    </div>

  </div>


  <!-- START -->

  <div id="startScreen">

    <div class="modal">

      <div class="emoji">🏎️</div>

      <h1>
        Ahsan <span>Street Rush</span>
      </h1>

      <p>
        Race through traffic, collect coins,
        increase your speed and survive as long
        as possible.
      </p>

      <div class="instructions">

        <div class="instruction">
          ← → Move
        </div>

        <div class="instruction">
          ↑ Accelerate
        </div>

        <div class="instruction">
          Space Brake
        </div>

        <div class="instruction">
          🪙 Collect Coins
        </div>

      </div>

      <button class="main-btn" id="startBtn">
        🏁 START RACE
      </button>

    </div>

  </div>


  <!-- GAME OVER -->

  <div id="gameOver" class="hidden">

    <div class="modal">

      <div class="emoji">💥</div>

      <h1>
        Race <span>Finished</span>
      </h1>

      <p>
        Your car collided with traffic.
      </p>

      <div class="instructions">

        <div class="instruction">
          Distance:
          <strong id="finalDistance">0 m</strong>
        </div>

        <div class="instruction">
          Coins:
          <strong id="finalCoins">0</strong>
        </div>

      </div>

      <button class="main-btn" id="restartBtn">
        🔄 RACE AGAIN
      </button>

    </div>

  </div>

</div>


<script>
/* =========================================================
   GAME VARIABLES
========================================================= */

const road = document.getElementById("road");
const player = document.getElementById("player");
const traffic = document.getElementById("traffic");

const distanceEl = document.getElementById("distance");
const coinsEl = document.getElementById("coins");
const speedEl = document.getElementById("speed");
const dialSpeed = document.getElementById("dialSpeed");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalDistance = document.getElementById("finalDistance");
const finalCoins = document.getElementById("finalCoins");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

let gameRunning = false;

let playerX = 50;

let speed = 0;
let maxSpeed = 220;

let distance = 0;
let coins = 0;

let acceleration = 0.12;
let brakePower = 0.35;
let friction = 0.04;

let lastTime = 0;
let spawnTimer = 0;
let coinTimer = 0;

let trafficCars = [];
let coinObjects = [];

let keys = {
  left:false,
  right:false,
  gas:false,
  brake:false
};


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;
let engineOsc = null;
let engineGain = null;
let engineFilter = null;

let audioStarted = false;


/* Start audio after user click */

function startEngineSound(){

  if(audioStarted) return;

  audioStarted = true;

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  engineOsc =
    audioContext.createOscillator();

  engineGain =
    audioContext.createGain();

  engineFilter =
    audioContext.createBiquadFilter();

  engineOsc.type = "sawtooth";

  engineOsc.frequency.value = 65;

  engineFilter.type = "lowpass";

  engineFilter.frequency.value = 900;

  engineGain.gain.value = 0.0001;

  engineOsc
    .connect(engineFilter)
    .connect(engineGain)
    .connect(audioContext.destination);

  engineOsc.start();

}


/* Engine sound update */

function updateEngineSound(){

  if(!audioContext || !engineOsc) return;

  const now = audioContext.currentTime;

  const rpm =
    55 +
    speed * 2.2 +
    (keys.gas ? 20 : 0);

  engineOsc.frequency.setTargetAtTime(
    rpm,
    now,
    0.04
  );

  const volume =
    gameRunning
      ? 0.018 + (speed / maxSpeed) * 0.045
      : 0.0001;

  engineGain.gain.setTargetAtTime(
    volume,
    now,
    0.06
  );

  engineFilter.frequency.setTargetAtTime(
    500 + speed * 7,
    now,
    0.05
  );

}


/* =========================================================
   ROAD LANES
========================================================= */

const lanes = [18,50,82];


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(dt){

  const moveSpeed =
    (0.055 + speed * 0.00025) *
    dt;

  if(keys.left){
    playerX -= moveSpeed * 1.8;
  }

  if(keys.right){
    playerX += moveSpeed * 1.8;
  }

  playerX =
    Math.max(
      11,
      Math.min(89,playerX)
    );

  player.style.left =
    playerX + "%";
}


/* =========================================================
   SPEED
========================================================= */

function updateSpeed(dt){

  if(keys.gas){

    speed +=
      acceleration * dt;

  }else{

    speed -=
      friction * dt;

  }

  if(keys.brake){

    speed -=
      brakePower * dt;
  }

  speed =
    Math.max(
      0,
      Math.min(maxSpeed,speed)
    );

}


/* =========================================================
   TRAFFIC CAR
========================================================= */

function createTrafficCar(){

  const car =
    document.createElement("div");

  car.className = "car";

  const lane =
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];

  const colors = [
    "#e53935",
    "#2563eb",
    "#f59e0b",
    "#16a34a",
    "#9333ea",
    "#f8fafc",
    "#111827"
  ];

  const color =
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  car.innerHTML = `

    <div class="wheel left top"></div>
    <div class="wheel right top"></div>
    <div class="wheel left bottom"></div>
    <div class="wheel right bottom"></div>

    <div class="car-body"
      style="
        background:
        linear-gradient(
          100deg,
          #111,
          ${color} 45%,
          #111
        );
      ">
    </div>

  `;

  car.dataset.lane = lane;

  car.style.left =
    lane + "%";

  car.style.top =
    "-180px";

  road.appendChild(car);

  trafficCars.push({
    el:car,
    y:-180,
    lane:lane,
    extraSpeed:
      0.65 + Math.random()*0.45
  });

}


/* =========================================================
   UPDATE TRAFFIC
========================================================= */

function updateTraffic(dt){

  const roadHeight =
    road.clientHeight;

  for(let i=trafficCars.length-1;i>=0;i--){

    const car =
      trafficCars[i];

    car.y +=
      (speed * 0.011) *
      car.extraSpeed *
      dt;

    car.el.style.top =
      car.y + "px";

    if(car.y > roadHeight + 180){

      car.el.remove();

      trafficCars.splice(i,1);

      continue;
    }

    if(checkCollision(
      player,
      car.el
    )){

      endGame();

      return;
    }

  }

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(a,b){

  const r1 =
    a.getBoundingClientRect();

  const r2 =
    b.getBoundingClientRect();

  const padding = 9;

  return !(
    r1.right-padding < r2.left+padding ||
    r1.left+padding > r2.right-padding ||
    r1.bottom-padding < r2.top+padding ||
    r1.top+padding > r2.bottom-padding
  );

}


/* =========================================================
   COINS
========================================================= */

function createCoin(){

  const coin =
    document.createElement("div");

  coin.style.position =
    "absolute";

  coin.style.width =
    "32px";

  coin.style.height =
    "32px";

  coin.style.borderRadius =
    "50%";

  coin.style.background =
    "radial-gradient(circle,#fff6a3 0 15%,#ffd000 30%,#e49b00 70%)";

  coin.style.border =
    "3px solid #fff1a6";

  coin.style.boxShadow =
    "0 0 20px rgba(255,210,0,.7)";

  coin.style.zIndex =
    "20";

  coin.style.display =
    "flex";

  coin.style.alignItems =
    "center";

  coin.style.justifyContent =
    "center";

  coin.textContent =
    "$";

  coin.style.color =
    "#8a5a00";

  coin.style.fontWeight =
    "bold";

  const lane =
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];

  coin.style.left =
    lane + "%";

  coin.style.top =
    "-60px";

  road.appendChild(coin);

  coinObjects.push({
    el:coin,
    y:-60,
    lane:lane
  });

}


function updateCoins(dt){

  const roadHeight =
    road.clientHeight;

  for(let i=coinObjects.length-1;i>=0;i--){

    const coin =
      coinObjects[i];

    coin.y +=
      speed * 0.013 * dt;

    coin.el.style.top =
      coin.y + "px";

    coin.el.style.transform =
      `translateX(-50%) rotate(${coin.y*4}deg)`;

    if(
      checkCollision(
        player,
        coin.el
      )
    ){

      coins++;

      coin.el.remove();

      coinObjects.splice(i,1);

      continue;
    }

    if(
      coin.y >
      roadHeight + 70
    ){

      coin.el.remove();

      coinObjects.splice(i,1);
    }

  }

}


/* =========================================================
   SCENERY
========================================================= */

function createScenery(){

  const scenery =
    document.getElementById("scenery");

  for(let i=0;i<14;i++){

    const tree =
      document.createElement("div");

    tree.className =
      "tree";

    tree.style.left =
      Math.random()*45 + "%";

    tree.style.top =
      (20 + Math.random()*65) + "%";

    scenery.appendChild(tree);

  }

}

createScenery();


/* =========================================================
   ROAD ANIMATION
========================================================= */

function updateRoad(dt){

  const lines =
    document.querySelectorAll(
      ".lane-line"
    );

  lines.forEach(line=>{

    let y =
      parseFloat(
        line.dataset.y || -150
      );

    y +=
      speed * 0.018 * dt;

    if(y > road.clientHeight){

      y = -150;
    }

    line.dataset.y = y;

    line.style.top =
      y + "px";

  });

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(timestamp){

  if(!gameRunning) return;

  if(!lastTime)
    lastTime = timestamp;

  const dt =
    Math.min(
      40,
      timestamp-lastTime
    );

  lastTime =
    timestamp;

  updateSpeed(dt);

  updatePlayer(dt);

  updateTraffic(dt);

  updateCoins(dt);

  updateRoad(dt);

  distance +=
    speed * 0.00085 * dt;

  distanceEl.textContent =
    Math.floor(distance) + " m";

  coinsEl.textContent =
    coins;

  speedEl.textContent =
    Math.floor(speed) + " km/h";

  dialSpeed.textContent =
    Math.floor(speed);

  updateEngineSound();

  spawnTimer += dt;

  coinTimer += dt;

  const trafficDelay =
    Math.max(
      650,
      1500 - speed*3
    );

  if(spawnTimer > trafficDelay){

    createTrafficCar();

    spawnTimer = 0;
  }

  if(coinTimer > 1000){

    createCoin();

    coinTimer = 0;
  }

  requestAnimationFrame(gameLoop);
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  startEngineSound();

  if(audioContext &&
     audioContext.state === "suspended"){

    audioContext.resume();
  }

  trafficCars.forEach(
    c=>c.el.remove()
  );

  coinObjects.forEach(
    c=>c.el.remove()
  );

  trafficCars = [];
  coinObjects = [];

  speed = 0;
  distance = 0;
  coins = 0;
  playerX = 50;

  player.style.left =
    "50%";

  gameRunning = true;

  startScreen.classList.add(
    "hidden"
  );

  gameOverScreen.classList.add(
    "hidden"
  );

  lastTime = 0;
  spawnTimer = 0;
  coinTimer = 0;

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!gameRunning)
    return;

  gameRunning = false;

  if(audioContext){

    engineGain.gain.setTargetAtTime(
      0.0001,
      audioContext.currentTime,
      0.05
    );

  }

  finalDistance.textContent =
    Math.floor(distance) + " m";

  finalCoins.textContent =
    coins;

  gameOverScreen.classList.remove(
    "hidden"
  );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      keys.left = true;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      keys.right = true;

    }

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      keys.gas = true;

    }

    if(e.code==="Space"){

      e.preventDefault();

      keys.brake = true;
    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      keys.left = false;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      keys.right = false;

    }

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      keys.gas = false;

    }

    if(e.code==="Space"){

      keys.brake = false;

    }

  }
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

function holdButton(
  element,
  key
){

  const down = e=>{
    e.preventDefault();
    keys[key] = true;
  };

  const up = e=>{
    e.preventDefault();
    keys[key] = false;
  };

  element.addEventListener(
    "touchstart",
    down,
    {passive:false}
  );

  element.addEventListener(
    "touchend",
    up,
    {passive:false}
  );

  element.addEventListener(
    "touchcancel",
    up,
    {passive:false}
  );

  element.addEventListener(
    "mousedown",
    down
  );

  element.addEventListener(
    "mouseup",
    up
  );

  element.addEventListener(
    "mouseleave",
    up
  );
}


holdButton(
  document.getElementById("leftBtn"),
  "left"
);

holdButton(
  document.getElementById("rightBtn"),
  "right"
);

holdButton(
  document.getElementById("gasBtn"),
  "gas"
);

holdButton(
  document.getElementById("brakeBtn"),
  "brake"
);


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
  "click",
  startGame
);

restartBtn.addEventListener(
  "click",
  startGame
);

</script>
