<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ahsan Racing | Car Racing Game</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050816;
  color:white;
  overflow:hidden;
  user-select:none;
}

/* =========================
   GAME WRAPPER
========================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#111;
}

/* =========================
   CANVAS
========================= */

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* =========================
   TOP HUD
========================= */

#hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:10;

  pointer-events:none;
}

.hud-box{
  min-width:125px;

  padding:10px 15px;

  border-radius:12px;

  background:rgba(5,10,25,.78);

  border:1px solid rgba(255,255,255,.15);

  backdrop-filter:blur(10px);

  box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.hud-label{
  font-size:11px;
  color:#94a3b8;
  text-transform:uppercase;
}

.hud-value{
  margin-top:3px;
  font-size:22px;
  font-weight:bold;
}

#speed{
  color:#38bdf8;
}

#coins{
  color:#facc15;
}

/* =========================
   START SCREEN
========================= */

#startScreen,
#gameOverScreen{
  position:absolute;
  inset:0;

  z-index:30;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(37,99,235,.18),
      rgba(2,6,23,.96) 65%
    );
}

.panel{
  width:min(500px,90%);

  padding:35px;

  text-align:center;

  border-radius:25px;

  background:rgba(15,23,42,.92);

  border:1px solid rgba(56,189,248,.25);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);

  backdrop-filter:blur(15px);
}

.panel h1{
  font-size:42px;
  margin-bottom:10px;
}

.panel h1 span{
  color:#38bdf8;
}

.panel p{
  color:#cbd5e1;
  line-height:1.7;
  margin:15px 0;
}

.start-btn{
  border:0;
  padding:15px 35px;

  border-radius:12px;

  background:#2563eb;

  color:white;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.start-btn:hover{
  transform:translateY(-3px);
  background:#1d4ed8;
  box-shadow:0 12px 30px rgba(37,99,235,.35);
}

.controls{
  margin-top:20px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;

  font-size:13px;
  color:#94a3b8;
}

.control{
  padding:10px;

  border:1px solid #1e293b;

  border-radius:10px;

  background:#0b1120;
}

/* =========================
   PAUSE
========================= */

#pauseButton{
  position:absolute;

  right:15px;
  bottom:110px;

  z-index:20;

  width:50px;
  height:50px;

  border:1px solid rgba(255,255,255,.2);

  border-radius:50%;

  background:rgba(5,10,25,.8);

  color:white;

  font-size:20px;

  cursor:pointer;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
  position:absolute;

  left:0;
  right:0;
  bottom:20px;

  z-index:20;

  display:flex;

  justify-content:space-between;

  padding:0 25px;

  pointer-events:none;
}

.control-group{
  display:flex;
  gap:12px;

  pointer-events:auto;
}

.game-btn{
  width:65px;
  height:65px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(5,10,25,.78);

  color:white;

  font-size:24px;

  box-shadow:0 8px 20px rgba(0,0,0,.3);

  touch-action:none;
}

.game-btn:active{
  transform:scale(.94);
  background:#1e3a8a;
}

#brakeBtn{
  color:#f87171;
}

#gasBtn{
  color:#4ade80;
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none !important;
}

/* =========================
   GAME OVER
========================= */

.final-score{
  margin:20px 0;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;
}

.final-box{
  padding:15px;

  border-radius:12px;

  background:#0b1120;

  border:1px solid #1e293b;
}

.final-box strong{
  display:block;
  font-size:25px;
  margin-top:5px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .hud-box{
    min-width:95px;
    padding:8px 10px;
  }

  .hud-value{
    font-size:18px;
  }

  .panel h1{
    font-size:32px;
  }

  .panel{
    padding:25px 18px;
  }

  #mobileControls{
    bottom:15px;
    padding:0 15px;
  }

  .game-btn{
    width:58px;
    height:58px;
  }

}

</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>


  <!-- HUD -->

  <div id="hud">

    <div class="hud-box">

      <div class="hud-label">
        Speed
      </div>

      <div class="hud-value">
        <span id="speed">0</span>
        <small> km/h</small>
      </div>

    </div>


    <div class="hud-box">

      <div class="hud-label">
        Coins
      </div>

      <div class="hud-value" id="coins">
        0
      </div>

    </div>


    <div class="hud-box">

      <div class="hud-label">
        Distance
      </div>

      <div class="hud-value">
        <span id="distance">0</span>
        m
      </div>

    </div>

  </div>


  <!-- START SCREEN -->

  <div id="startScreen">

    <div class="panel">

      <h1>
        🏎️ Ahsan <span>Racing</span>
      </h1>

      <p>
        Accelerate, brake, avoid traffic and
        collect coins on the highway.
      </p>

      <button
        class="start-btn"
        onclick="startGame()"
      >
        ▶ START RACE
      </button>


      <div class="controls">

        <div class="control">
          ⬅️ ➡️ Steering
        </div>

        <div class="control">
          ⬆️ Accelerate
        </div>

        <div class="control">
          ⬇️ Brake
        </div>

        <div class="control">
          P = Pause
        </div>

      </div>

    </div>

  </div>


  <!-- GAME OVER -->

  <div
    id="gameOverScreen"
    class="hidden"
  >

    <div class="panel">

      <h1>
        🏁 Race Over
      </h1>

      <p>
        Your race has ended.
      </p>


      <div class="final-score">

        <div class="final-box">

          Coins

          <strong id="finalCoins">
            0
          </strong>

        </div>


        <div class="final-box">

          Distance

          <strong id="finalDistance">
            0m
          </strong>

        </div>

      </div>


      <button
        class="start-btn"
        onclick="restartGame()"
      >
        🔄 RACE AGAIN
      </button>

    </div>

  </div>


  <!-- PAUSE -->

  <button
    id="pauseButton"
    onclick="togglePause()"
  >
    ⏸
  </button>


  <!-- MOBILE CONTROLS -->

  <div id="mobileControls">

    <div class="control-group">

      <button
        class="game-btn"
        id="leftBtn"
      >
        ◀
      </button>

      <button
        class="game-btn"
        id="rightBtn"
      >
        ▶
      </button>

    </div>


    <div class="control-group">

      <button
        class="game-btn"
        id="brakeBtn"
      >
        🛑
      </button>

      <button
        class="game-btn"
        id="gasBtn"
      >
        ⚡
      </button>

    </div>

  </div>

  <canvas id="gameCanvas"></canvas>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

  W = canvas.width =
    window.innerWidth *
    devicePixelRatio;

  H = canvas.height =
    window.innerHeight *
    devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  W = window.innerWidth;
  H = window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   GAME STATE
===================================================== */

let running = false;
let paused = false;

let speed = 0;

const MAX_SPEED = 185;

const ACCELERATION = 0.16;

const BRAKE_POWER = 0.65;

const FRICTION = 0.035;

let distance = 0;

let coinCount = 0;

let roadOffset = 0;

let spawnTimer = 0;

let coinTimer = 0;

let lastTime = 0;


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane:1,

  x:0,

  y:0,

  width:55,

  height:105,

  targetX:0

};


/* =====================================================
   LANES
===================================================== */

function roadWidth(){

  return Math.min(
    500,
    W * .72
  );

}

function laneWidth(){

  return roadWidth()/3;

}

function laneX(lane){

  const rw =
    roadWidth();

  const left =
    (W-rw)/2;

  return (
    left +
    laneWidth()*lane +
    laneWidth()/2
  );

}


/* =====================================================
   AI CARS
===================================================== */

let cars = [];

const carColors = [

  "#ef4444",
  "#f97316",
  "#22c55e",
  "#a855f7",
  "#facc15",
  "#06b6d4"

];


function spawnCar(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  cars.push({

    lane:lane,

    y:-130,

    speed:
      45 +
      Math.random()*75,

    color:
      carColors[
        Math.floor(
          Math.random()*
          carColors.length
        )
      ],

    width:50,

    height:95

  });

}


/* =====================================================
   COINS
===================================================== */

let coins = [];


function spawnCoin(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  coins.push({

    lane:lane,

    y:-40,

    size:13,

    rotation:0

  });

}


/* =====================================================
   DRAW ROAD
===================================================== */

function drawRoad(){

  ctx.fillStyle =
    "#77a96b";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* roadside */

  ctx.fillStyle =
    "#5c8f50";

  ctx.fillRect(
    0,
    0,
    (W-roadWidth())/2,
    H
  );

  ctx.fillRect(
    (W+roadWidth())/2,
    0,
    (W-roadWidth())/2,
    H
  );


  /* road */

  const rw =
    roadWidth();

  const left =
    (W-rw)/2;

  ctx.fillStyle =
    "#252936";

  ctx.fillRect(
    left,
    0,
    rw,
    H
  );


  /* road edges */

  ctx.fillStyle =
    "#f8fafc";

  ctx.fillRect(
    left,
    0,
    5,
    H
  );

  ctx.fillRect(
    left+rw-5,
    0,
    5,
    H
  );


  /* lane lines */

  ctx.strokeStyle =
    "rgba(255,255,255,.75)";

  ctx.lineWidth = 4;

  ctx.setLineDash([
    28,
    28
  ]);

  ctx.lineDashOffset =
    roadOffset;

  for(let i=1;i<3;i++){

    const x =
      left +
      laneWidth()*i;

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();

  }

  ctx.setLineDash([]);


  /* roadside lines */

  for(
    let y =
      (roadOffset % 100)-100;
    y<H;
    y+=100
  ){

    ctx.fillStyle =
      "#f8fafc";

    ctx.fillRect(
      left-14,
      y,
      7,
      45
    );

    ctx.fillRect(
      left+rw+7,
      y,
      7,
      45
    );

  }

}


/* =====================================================
   DRAW PLAYER CAR
===================================================== */

function drawPlayer(){

  const x =
    laneX(player.lane);

  const y =
    H-145;

  player.x = x;
  player.y = y;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    42,
    38,
    70,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  const gradient =
    ctx.createLinearGradient(
      -28,
      -55,
      28,
      55
    );

  gradient.addColorStop(
    0,
    "#38bdf8"
  );

  gradient.addColorStop(
    .5,
    "#2563eb"
  );

  gradient.addColorStop(
    1,
    "#172554"
  );

  ctx.fillStyle =
    gradient;


  /* main car */

  ctx.beginPath();

  ctx.roundRect(
    -27,
    -55,
    54,
    110,
    14
  );

  ctx.fill();


  /* roof */

  ctx.fillStyle =
    "#0f172a";

  ctx.beginPath();

  ctx.roundRect(
    -20,
    -25,
    40,
    45,
    11
  );

  ctx.fill();


  /* windshield */

  ctx.fillStyle =
    "#7dd3fc";

  ctx.globalAlpha=.75;

  ctx.beginPath();

  ctx.roundRect(
    -16,
    -21,
    32,
    20,
    7
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* rear glass */

  ctx.fillStyle =
    "#1e293b";

  ctx.beginPath();

  ctx.roundRect(
    -15,
    5,
    30,
    12,
    5
  );

  ctx.fill();


  /* headlights */

  ctx.fillStyle =
    "#e0f2fe";

  ctx.beginPath();

  ctx.roundRect(
    -22,
    -49,
    14,
    7,
    3
  );

  ctx.fill();

  ctx.beginPath();

  ctx.roundRect(
    8,
    -49,
    14,
    7,
    3
  );

  ctx.fill();


  /* wheels */

  ctx.fillStyle =
    "#050505";

  [
    [-30,-30],
    [30,-30],
    [-30,30],
    [30,30]
  ].forEach(
    p=>{

      ctx.beginPath();

      ctx.roundRect(
        p[0]-4,
        p[1]-13,
        8,
        26,
        3
      );

      ctx.fill();

    }
  );


  /* spoiler */

  ctx.fillStyle =
    "#111827";

  ctx.fillRect(
    -23,
    48,
    46,
    5
  );


  ctx.restore();

}


/* =====================================================
   DRAW AI CAR
===================================================== */

function drawAI(car){

  const x =
    laneX(car.lane);

  ctx.save();

  ctx.translate(
    x,
    car.y
  );


  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    25,
    35,
    60,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  ctx.fillStyle =
    car.color;

  ctx.beginPath();

  ctx.roundRect(
    -25,
    -48,
    50,
    96,
    12
  );

  ctx.fill();


  /* roof */

  ctx.fillStyle =
    "#111827";

  ctx.beginPath();

  ctx.roundRect(
    -18,
    -20,
    36,
    40,
    9
  );

  ctx.fill();


  /* glass */

  ctx.fillStyle =
    "#94a3b8";

  ctx.globalAlpha=.7;

  ctx.beginPath();

  ctx.roundRect(
    -14,
    -16,
    28,
    17,
    5
  );

  ctx.fill();

  ctx.globalAlpha=1;


  /* lights */

  ctx.fillStyle =
    "#f8fafc";

  ctx.fillRect(
    -20,
    -42,
    12,
    5
  );

  ctx.fillRect(
    8,
    -42,
    12,
    5
  );


  /* wheels */

  ctx.fillStyle =
    "#050505";

  [
    [-27,-28],
    [27,-28],
    [-27,28],
    [27,28]
  ].forEach(
    p=>{

      ctx.fillRect(
        p[0]-4,
        p[1]-11,
        8,
        22
      );

    }
  );


  ctx.restore();

}


/* =====================================================
   DRAW COIN
===================================================== */

function drawCoin(coin){

  const x =
    laneX(coin.lane);

  ctx.save();

  ctx.translate(
    x,
    coin.y
  );

  coin.rotation += .08;

  const scale =
    Math.abs(
      Math.cos(
        coin.rotation
      )
    );

  ctx.scale(
    scale,
    1
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    coin.size,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#facc15";

  ctx.fill();

  ctx.strokeStyle =
    "#fde68a";

  ctx.lineWidth=3;

  ctx.stroke();


  ctx.fillStyle =
    "#92400e";

  ctx.font =
    "bold 13px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "$",
    0,
    1
  );

  ctx.restore();

}


/* =====================================================
   INPUT
===================================================== */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()]=true;

    if(
      ["arrowleft",
       "arrowright",
       "arrowup",
       "arrowdown",
       " "].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

    if(
      e.key.toLowerCase()==="p"
    ){

      togglePause();

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[e.key.toLowerCase()]=false;

  }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

function holdButton(
  id,
  key
){

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      keys[key]=true;

    }
  );

  button.addEventListener(
    "pointerup",
    ()=>{
      keys[key]=false;
    }
  );

  button.addEventListener(
    "pointerleave",
    ()=>{
      keys[key]=false;
    }
  );

  button.addEventListener(
    "pointercancel",
    ()=>{
      keys[key]=false;
    }
  );

}


holdButton(
  "leftBtn",
  "arrowleft"
);

holdButton(
  "rightBtn",
  "arrowright"
);

holdButton(
  "gasBtn",
  "arrowup"
);

holdButton(
  "brakeBtn",
  "arrowdown"
);


/* =====================================================
   STEERING
===================================================== */

let steeringCooldown=0;

function handleSteering(){

  if(steeringCooldown>0){

    steeringCooldown--;

    return;

  }

  if(
    keys["arrowleft"] ||
    keys["a"]
  ){

    if(
      player.lane>0
    ){

      player.lane--;

    }

    steeringCooldown=12;

  }


  if(
    keys["arrowright"] ||
    keys["d"]
  ){

    if(
      player.lane<2
    ){

      player.lane++;

    }

    steeringCooldown=12;

  }

}


/* =====================================================
   SPEED
===================================================== */

function updateSpeed(){

  const gas =
    keys["arrowup"] ||
    keys["w"];

  const brake =
    keys["arrowdown"] ||
    keys["s"];


  if(gas){

    speed +=
      ACCELERATION *
      (1 + speed/MAX_SPEED);

  }
  else{

    speed -=
      FRICTION;

  }


  if(brake){

    speed -=
      BRAKE_POWER;

  }


  speed =
    Math.max(
      0,
      Math.min(
        MAX_SPEED,
        speed
      )
    );

}


/* =====================================================
   COLLISION
===================================================== */

function collision(
  ax,
  ay,
  aw,
  ah,
  bx,
  by,
  bw,
  bh
){

  return (
    Math.abs(ax-bx)
      < (aw+bw)/2 &&
    Math.abs(ay-by)
      < (ah+bh)/2
  );

}


/* =====================================================
   GAME UPDATE
===================================================== */

function update(dt){

  if(!running || paused)
    return;


  handleSteering();

  updateSpeed();


  /* road movement */

  const movement =
    speed * dt * .55;

  roadOffset +=
    movement;

  distance +=
    speed * dt * .012;


  /* spawn traffic */

  spawnTimer -= dt;

  if(
    spawnTimer<=0
  ){

    spawnCar();

    spawnTimer =
      Math.max(
        .65,
        1.8 -
        speed/180
      );

  }


  /* spawn coins */

  coinTimer -= dt;

  if(
    coinTimer<=0
  ){

    spawnCoin();

    coinTimer =
      .8 +
      Math.random()*.8;

  }


  /* AI */

  for(
    let i=cars.length-1;
    i>=0;
    i--
  ){

    const car =
      cars[i];

    car.y +=
      movement *
      (1 - car.speed/250);


    if(
      car.y >
      H+150
    ){

      cars.splice(
        i,
        1
      );

      continue;

    }


    /* collision */

    if(
      collision(
        player.x,
        player.y,
        player.width,
        player.height,
        laneX(car.lane),
        car.y,
        car.width,
        car.height
      )
    ){

      gameOver();

      return;

    }

  }


  /* coins */

  for(
    let i=coins.length-1;
    i>=0;
    i--
  ){

    const coin =
      coins[i];

    coin.y +=
      movement;


    if(
      coin.y >
      H+50
    ){

      coins.splice(
        i,
        1
      );

      continue;

    }


    if(
      coin.lane===
      player.lane &&
      Math.abs(
        coin.y-player.y
      )<65
    ){

      coinCount++;

      coins.splice(
        i,
        1
      );

      playCoinSound();

    }

  }


  /* HUD */

  document.getElementById(
    "speed"
  ).textContent =
    Math.round(speed);

  document.getElementById(
    "coins"
  ).textContent =
    coinCount;

  document.getElementById(
    "distance"
  ).textContent =
    Math.floor(distance);

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawRoad();


  coins.forEach(
    drawCoin
  );


  cars.forEach(
    drawAI
  );


  drawPlayer();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  const dt =
    Math.min(
      (time-lastTime)/1000,
      .05
    );

  lastTime=time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}

requestAnimationFrame(
  loop
);


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext=null;

let engineOsc=null;

let engineGain=null;


function startAudio(){

  if(audioContext)
    return;

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  engineOsc =
    audioContext.createOscillator();

  engineGain =
    audioContext.createGain();


  engineOsc.type =
    "sawtooth";

  engineOsc.frequency.value =
    70;

  engineGain.gain.value =
    0;


  engineOsc.connect(
    engineGain
  );

  engineGain.connect(
    audioContext.destination
  );

  engineOsc.start();

}


function updateEngineSound(){

  if(
    !audioContext ||
    !engineOsc ||
    !engineGain
  )
    return;


  const volume =
    running &&
    !paused
      ? .035
      : 0;


  engineGain.gain
    .linearRampToValueAtTime(
      volume,
      audioContext.currentTime+.05
    );


  engineOsc.frequency
    .linearRampToValueAtTime(
      65 + speed*1.7,
      audioContext.currentTime+.05
    );

}


function playCoinSound(){

  if(!audioContext)
    return;


  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  osc.type =
    "sine";

  osc.frequency.value =
    850;


  gain.gain.value =
    .12;


  osc.connect(gain);

  gain.connect(
    audioContext.destination
  );


  osc.start();

  osc.frequency.exponentialRampToValueAtTime(
    1300,
    audioContext.currentTime+.12
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+.15
  );

  osc.stop(
    audioContext.currentTime+.15
  );

}


/* =====================================================
   AUDIO LOOP
===================================================== */

setInterval(
  updateEngineSound,
  50
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  startAudio();

  if(
    audioContext.state==="suspended"
  ){

    audioContext.resume();

  }


  running=true;

  paused=false;

  speed=0;

  distance=0;

  coinCount=0;

  cars=[];

  coins=[];

  spawnTimer=.5;

  coinTimer=.5;


  document.getElementById(
    "startScreen"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "gameOverScreen"
  ).classList.add(
    "hidden"
  );

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!running)
    return;

  paused=!paused;

  document.getElementById(
    "pauseButton"
  ).textContent =
    paused ? "▶" : "⏸";

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running=false;

  speed=0;

  document.getElementById(
    "finalCoins"
  ).textContent =
    coinCount;

  document.getElementById(
    "finalDistance"
  ).textContent =
    Math.floor(distance)+"m";

  document.getElementById(
    "gameOverScreen"
  ).classList.remove(
    "hidden"
  );

}


function restartGame(){

  startGame();

}


/* =====================================================
   INITIAL DRAW
===================================================== */

draw();

</script>
