<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🏎️ Ahsan Racing</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
}

/* TOP UI */

.top-ui{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  z-index:10;

  display:flex;
  justify-content:space-between;
  align-items:center;

  pointer-events:none;
}

.panel{
  background:rgba(5,10,20,.78);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  border-radius:14px;
  padding:10px 15px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.stats{
  display:flex;
  gap:18px;
  align-items:center;
}

.stat{
  text-align:center;
}

.stat small{
  display:block;
  color:#94a3b8;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat strong{
  font-size:20px;
}

.coin{
  color:#ffd43b;
}

/* SPEED */

.speed-box{
  position:fixed;
  right:18px;
  bottom:25px;

  width:125px;
  height:125px;

  border-radius:50%;

  background:
    radial-gradient(circle,#111827 55%,#020617 56%);

  border:5px solid #334155;

  box-shadow:
    0 0 30px rgba(56,189,248,.15);

  z-index:10;

  text-align:center;
  padding-top:30px;

  pointer-events:none;
}

.speed{
  font-size:32px;
  font-weight:bold;
  color:#38bdf8;
}

.speed-label{
  color:#94a3b8;
  font-size:10px;
  letter-spacing:2px;
}

/* CONTROLS */

.controls{
  position:fixed;
  bottom:25px;
  left:20px;

  display:flex;
  gap:12px;

  z-index:20;
}

.control{
  width:62px;
  height:62px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.18);

  background:rgba(15,23,42,.85);

  color:white;

  font-size:25px;

  box-shadow:0 8px 25px rgba(0,0,0,.35);

  cursor:pointer;

  touch-action:none;
}

.control:active{
  transform:scale(.92);
  background:#2563eb;
}

.brake{
  background:rgba(127,29,29,.85);
}

.nitro{
  background:rgba(30,64,175,.85);
}

/* START SCREEN */

.overlay{
  position:fixed;
  inset:0;

  z-index:50;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(
      circle at center,
      rgba(30,64,175,.3),
      rgba(2,6,23,.96)
    );

  padding:20px;
}

.start-card{
  width:min(500px,100%);

  text-align:center;

  padding:40px 25px;

  border-radius:25px;

  background:rgba(15,23,42,.92);

  border:1px solid rgba(56,189,248,.25);

  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.logo{
  font-size:46px;
  margin-bottom:10px;
}

.start-card h1{
  font-size:38px;
  margin-bottom:10px;
}

.start-card h1 span{
  color:#38bdf8;
}

.start-card p{
  color:#94a3b8;
  line-height:1.7;
  margin-bottom:25px;
}

.start-btn{
  border:none;
  padding:15px 32px;

  border-radius:12px;

  background:linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
  );

  color:white;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:0 12px 30px rgba(37,99,235,.3);
}

.start-btn:hover{
  transform:translateY(-2px);
}

.instructions{
  margin-top:25px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.instruction{
  padding:12px 5px;

  background:#0b1120;

  border-radius:10px;

  color:#cbd5e1;

  font-size:12px;
}

.instruction b{
  display:block;
  color:#38bdf8;
  font-size:20px;
  margin-bottom:5px;
}

/* GAME OVER */

.game-over{
  display:none;
}

.game-over h1{
  font-size:42px;
  margin-bottom:10px;
}

.final-score{
  font-size:22px;
  margin:15px 0;
}

.final-score span{
  color:#38bdf8;
}

/* MOBILE */

@media(max-width:600px){

  .top-ui{
    top:10px;
    left:8px;
    right:8px;
  }

  .panel{
    padding:8px 10px;
  }

  .stats{
    gap:10px;
  }

  .stat strong{
    font-size:16px;
  }

  .speed-box{
    width:105px;
    height:105px;
    right:10px;
    bottom:18px;
    padding-top:25px;
  }

  .speed{
    font-size:27px;
  }

  .controls{
    left:10px;
    bottom:18px;
  }

  .control{
    width:55px;
    height:55px;
  }

  .start-card h1{
    font-size:30px;
  }

  .instructions{
    grid-template-columns:1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- TOP UI -->

<div class="top-ui">

  <div class="panel stats">

    <div class="stat">
      <small>Score</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>Coins</small>
      <strong class="coin">🪙 <span id="coins">0</span></strong>
    </div>

    <div class="stat">
      <small>Best</small>
      <strong id="best">0</strong>
    </div>

  </div>

  <div class="panel">
    🏎️ <strong>AHsan Racing</strong>
  </div>

</div>


<!-- SPEED -->

<div class="speed-box">

  <div class="speed" id="speed">
    0
  </div>

  <div class="speed-label">
    KM/H
  </div>

</div>


<!-- CONTROLS -->

<div class="controls">

  <button class="control" id="leftBtn">
    ◀
  </button>

  <button class="control brake" id="brakeBtn">
    🛑
  </button>

  <button class="control" id="rightBtn">
    ▶
  </button>

  <button class="control nitro" id="nitroBtn">
    ⚡
  </button>

</div>


<!-- START -->

<div class="overlay" id="startScreen">

  <div class="start-card">

    <div class="logo">
      🏎️
    </div>

    <h1>
      Ahsan <span>Racing</span>
    </h1>

    <p>
      Race through traffic, collect coins,
      increase your speed and survive as long
      as possible.
    </p>

    <button class="start-btn" id="startBtn">
      🚀 START RACE
    </button>

    <div class="instructions">

      <div class="instruction">
        <b>← →</b>
        Move
      </div>

      <div class="instruction">
        <b>🛑</b>
        Brake
      </div>

      <div class="instruction">
        <b>⚡</b>
        Nitro
      </div>

    </div>

  </div>

</div>


<!-- GAME OVER -->

<div class="overlay game-over" id="gameOver">

  <div class="start-card">

    <div class="logo">
      💥
    </div>

    <h1>
      Race Over
    </h1>

    <div class="final-score">
      Score:
      <span id="finalScore">0</span>
    </div>

    <div class="final-score">
      Coins:
      <span id="finalCoins">0</span>
    </div>

    <button class="start-btn" id="restartBtn">
      🔄 RACE AGAIN
    </button>

  </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize(){

  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let score = 0;
let coins = 0;

let best =
  Number(localStorage.getItem("ahsanRaceBest") || 0);

document.getElementById("best").textContent = best;

let speed = 0;

let maxSpeed = 210;

let roadOffset = 0;

let spawnTimer = 0;

let coinTimer = 0;

let lastTime = 0;

let nitro = false;

let brake = false;


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane:1,

  x:0,

  y:0,

  width:70,

  height:125,

  targetX:0

};


/* =====================================================
   TRAFFIC
===================================================== */

let traffic = [];

let coinList = [];


/* =====================================================
   LANE
===================================================== */

function laneX(lane){

  const roadWidth = Math.min(W * .72,520);

  const roadLeft =
    (W-roadWidth)/2;

  const laneWidth =
    roadWidth/3;

  return roadLeft +
    laneWidth*lane +
    laneWidth/2;

}


/* =====================================================
   ROAD
===================================================== */

function drawRoad(){

  const roadWidth =
    Math.min(W*.72,520);

  const left =
    (W-roadWidth)/2;

  /* GRASS */

  const gradient =
    ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#182b18");
  gradient.addColorStop(1,"#071207");

  ctx.fillStyle=gradient;

  ctx.fillRect(0,0,W,H);


  /* ROAD */

  const roadGradient =
    ctx.createLinearGradient(
      left,0,
      left+roadWidth,0
    );

  roadGradient.addColorStop(0,"#171b22");
  roadGradient.addColorStop(.5,"#30343b");
  roadGradient.addColorStop(1,"#171b22");

  ctx.fillStyle=roadGradient;

  ctx.fillRect(
    left,
    0,
    roadWidth,
    H
  );


  /* ROAD EDGES */

  ctx.fillStyle="#e5e7eb";

  ctx.fillRect(
    left,
    0,
    5,
    H
  );

  ctx.fillRect(
    left+roadWidth-5,
    0,
    5,
    H
  );


  /* LANE LINES */

  const laneWidth =
    roadWidth/3;

  ctx.lineWidth=4;

  ctx.setLineDash([35,30]);

  ctx.strokeStyle=
    "rgba(255,255,255,.65)";

  for(let i=1;i<3;i++){

    const x =
      left+laneWidth*i;

    ctx.beginPath();

    ctx.moveTo(x,-100+roadOffset);
    ctx.lineTo(x,H+100);

    ctx.stroke();

  }

  ctx.setLineDash([]);


  /* ROAD SHADOW */

  const shadow =
    ctx.createLinearGradient(
      left,0,
      left+roadWidth,0
    );

  shadow.addColorStop(0,
    "rgba(0,0,0,.45)");

  shadow.addColorStop(.15,
    "transparent");

  shadow.addColorStop(.85,
    "transparent");

  shadow.addColorStop(1,
    "rgba(0,0,0,.45)");

  ctx.fillStyle=shadow;

  ctx.fillRect(
    left,
    0,
    roadWidth,
    H
  );

}


/* =====================================================
   CAR DRAWING
===================================================== */

function drawCar(x,y,w,h,type="player"){

  ctx.save();

  ctx.translate(x,y);


  /* SHADOW */

  ctx.fillStyle=
    "rgba(0,0,0,.5)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.43,
    w*.55,
    h*.12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* BODY */

  let bodyColor="#111827";

  if(type==="red")
    bodyColor="#b91c1c";

  if(type==="blue")
    bodyColor="#1d4ed8";

  if(type==="white")
    bodyColor="#e5e7eb";

  if(type==="gold")
    bodyColor="#ca8a04";


  const body =
    ctx.createLinearGradient(
      -w/2,0,
      w/2,0
    );

  body.addColorStop(0,
    shade(bodyColor,-25));

  body.addColorStop(.5,
    bodyColor);

  body.addColorStop(1,
    shade(bodyColor,-25));

  ctx.fillStyle=body;


  /* MAIN BODY */

  ctx.beginPath();

  ctx.moveTo(-w*.35,h*.48);

  ctx.lineTo(-w*.45,h*.22);

  ctx.lineTo(-w*.36,-h*.30);

  ctx.quadraticCurveTo(
    0,
    -h*.52,
    w*.36,
    -h*.30
  );

  ctx.lineTo(w*.45,h*.22);

  ctx.lineTo(w*.35,h*.48);

  ctx.quadraticCurveTo(
    0,
    h*.57,
    -w*.35,
    h*.48
  );

  ctx.closePath();

  ctx.fill();


  /* SIDE BLACK AREA */

  ctx.fillStyle="#05070b";

  ctx.beginPath();

  ctx.moveTo(-w*.32,-h*.18);

  ctx.lineTo(-w*.18,-h*.39);

  ctx.lineTo(w*.18,-h*.39);

  ctx.lineTo(w*.32,-h*.18);

  ctx.lineTo(w*.24,h*.02);

  ctx.lineTo(-w*.24,h*.02);

  ctx.closePath();

  ctx.fill();


  /* WINDSHIELD */

  const glass =
    ctx.createLinearGradient(
      -w*.25,-h*.35,
      w*.25,0
    );

  glass.addColorStop(0,
    "#94a3b8");

  glass.addColorStop(.4,
    "#172554");

  glass.addColorStop(1,
    "#020617");

  ctx.fillStyle=glass;

  ctx.beginPath();

  ctx.moveTo(-w*.17,-h*.34);

  ctx.lineTo(w*.17,-h*.34);

  ctx.lineTo(w*.25,-h*.05);

  ctx.lineTo(-w*.25,-h*.05);

  ctx.closePath();

  ctx.fill();


  /* FRONT GLASS REFLECTION */

  ctx.strokeStyle=
    "rgba(255,255,255,.35)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(-w*.13,-h*.30);

  ctx.lineTo(w*.12,-h*.30);

  ctx.stroke();


  /* HEADLIGHTS */

  ctx.fillStyle="#dff9ff";

  ctx.shadowBlur=12;

  ctx.shadowColor="#38bdf8";

  roundRect(
    -w*.32,
    h*.15,
    w*.18,
    h*.08,
    5
  );

  ctx.fill();

  roundRect(
    w*.14,
    h*.15,
    w*.18,
    h*.08,
    5
  );

  ctx.fill();

  ctx.shadowBlur=0;


  /* FRONT SPLITTER */

  ctx.fillStyle="#020617";

  ctx.fillRect(
    -w*.32,
    h*.38,
    w*.64,
    h*.06
  );


  /* WHEELS */

  ctx.fillStyle="#020617";

  roundRect(
    -w*.52,
    -h*.05,
    w*.16,
    h*.32,
    6
  );

  ctx.fill();

  roundRect(
    w*.36,
    -h*.05,
    w*.16,
    h*.32,
    6
  );

  ctx.fill();


  /* REAR SPOILER */

  if(type==="player"){

    ctx.fillStyle="#020617";

    ctx.fillRect(
      -w*.45,
      -h*.42,
      w*.9,
      h*.045
    );

    ctx.fillRect(
      -w*.36,
      -h*.45,
      w*.04,
      h*.10
    );

    ctx.fillRect(
      w*.32,
      -h*.45,
      w*.04,
      h*.10
    );

  }


  /* CENTER STRIPE */

  if(type==="player"){

    ctx.fillStyle=
      "rgba(56,189,248,.85)";

    ctx.fillRect(
      -w*.025,
      -h*.43,
      w*.05,
      h*.78
    );

  }


  ctx.restore();

}


/* =====================================================
   COIN
===================================================== */

function drawCoin(c){

  ctx.save();

  ctx.translate(c.x,c.y);

  const scale =
    0.8+
    Math.sin(c.spin)*.2;

  ctx.scale(scale,1);

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    13,
    0,
    Math.PI*2
  );

  const gold =
    ctx.createRadialGradient(
      -4,-4,2,
      0,0,14
    );

  gold.addColorStop(0,"#fff7a8");
  gold.addColorStop(.3,"#ffd43b");
  gold.addColorStop(1,"#b77900");

  ctx.fillStyle=gold;

  ctx.shadowBlur=15;
  ctx.shadowColor="#ffd43b";

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.fillStyle="#9a6700";

  ctx.font="bold 13px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText("$",0,1);

  ctx.restore();

}


/* =====================================================
   HELPERS
===================================================== */

function roundRect(x,y,w,h,r){

  ctx.beginPath();

  ctx.roundRect(
    x,y,w,h,r
  );

}


function shade(hex,amt){

  let num =
    parseInt(hex.replace("#",""),16);

  let r =
    Math.max(
      0,
      Math.min(
        255,
        (num>>16)+amt
      )
    );

  let g =
    Math.max(
      0,
      Math.min(
        255,
        ((num>>8)&255)+amt
      )
    );

  let b =
    Math.max(
      0,
      Math.min(
        255,
        (num&255)+amt
      )
    );

  return "#" +
    (r<<16 |
     g<<8 |
     b)
     .toString(16)
     .padStart(6,"0");

}


/* =====================================================
   SPAWN TRAFFIC
===================================================== */

function spawnTraffic(){

  const lane =
    Math.floor(Math.random()*3);

  const types=[
    "red",
    "blue",
    "white",
    "gold"
  ];

  traffic.push({

    lane,

    x:laneX(lane),

    y:-150,

    width:65,

    height:115,

    speed:
      40+
      Math.random()*80,

    type:
      types[
        Math.floor(
          Math.random()*types.length
        )
      ]

  });

}


/* =====================================================
   SPAWN COIN
===================================================== */

function spawnCoin(){

  const lane =
    Math.floor(Math.random()*3);

  coinList.push({

    lane,

    x:laneX(lane),

    y:-30,

    spin:0

  });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

  return Math.abs(a.x-b.x)
      < (a.width+b.width)*.38
      &&
      Math.abs(a.y-b.y)
      < (a.height+b.height)*.38;

}


/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioCtx=null;
let engineOsc=null;
let engineGain=null;

function startAudio(){

  if(audioCtx)
    return;

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  engineOsc =
    audioCtx.createOscillator();

  engineGain =
    audioCtx.createGain();

  engineOsc.type="sawtooth";

  engineOsc.frequency.value=70;

  engineGain.gain.value=0.035;

  engineOsc.connect(engineGain);

  engineGain.connect(
    audioCtx.destination
  );

  engineOsc.start();

}


function coinSound(){

  if(!audioCtx)
    return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    700,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    1200,
    audioCtx.currentTime+.12
  );

  gain.gain.setValueAtTime(
    .15,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+.15
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.15
  );

}


function brakeSound(){

  if(!audioCtx)
    return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type="sawtooth";

  osc.frequency.value=90;

  gain.gain.value=.08;

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+.15
  );

}


/* =====================================================
   GAME START
===================================================== */

function startGame(){

  startAudio();

  if(audioCtx.state==="suspended")
    audioCtx.resume();

  score=0;
  coins=0;
  speed=70;

  traffic=[];
  coinList=[];

  player.lane=1;

  player.x=
    laneX(player.lane);

  player.y=
    H*.72;

  running=true;

  document.getElementById(
    "startScreen"
  ).style.display="none";

  document.getElementById(
    "gameOver"
  ).style.display="none";

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

  running=false;

  if(score>best){

    best=Math.floor(score);

    localStorage.setItem(
      "ahsanRaceBest",
      best
    );

  }

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  document.getElementById(
    "best"
  ).textContent=
    best;

  document.getElementById(
    "gameOver"
  ).style.display="flex";

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  if(!running)
    return;


  /* ACCELERATION */

  if(nitro){

    speed +=
      180*dt;

  }else if(brake){

    speed -=
      240*dt;

  }else{

    speed +=
      35*dt;

  }


  speed =
    Math.max(
      35,
      Math.min(
        nitro ? 300 : maxSpeed,
        speed
      )
    );


  /* SCORE */

  score +=
    speed*dt*.12;


  /* ROAD */

  roadOffset +=
    speed*dt*3;

  if(roadOffset>65)
    roadOffset-=65;


  /* PLAYER */

  player.targetX=
    laneX(player.lane);

  player.x +=
    (player.targetX-player.x)
    *Math.min(1,dt*10);


  /* TRAFFIC */

  spawnTimer -= dt;

  if(spawnTimer<=0){

    spawnTraffic();

    spawnTimer =
      Math.max(
        .35,
        1.15 -
        speed/500
      );

  }


  /* COINS */

  coinTimer -= dt;

  if(coinTimer<=0){

    spawnCoin();

    coinTimer=.8;

  }


  /* TRAFFIC MOVE */

  for(let i=traffic.length-1;i>=0;i--){

    const car=traffic[i];

    car.y +=
      (speed-car.speed)*dt*2.1;

    if(
      collision(
        player,
        car
      )
    ){

      endGame();
      return;

    }

    if(car.y>H+180){

      traffic.splice(i,1);

    }

  }


  /* COINS MOVE */

  for(let i=coinList.length-1;i>=0;i--){

    const c=coinList[i];

    c.y +=
      speed*dt*2.4;

    c.spin +=
      dt*8;


    if(
      Math.abs(player.x-c.x)<45 &&
      Math.abs(player.y-c.y)<70
    ){

      coins++;

      score+=100;

      coinSound();

      coinList.splice(i,1);

      continue;

    }


    if(c.y>H+50){

      coinList.splice(i,1);

    }

  }


  /* ENGINE */

  if(engineOsc){

    engineOsc.frequency.value =
      55 +
      speed*.65;

    engineGain.gain.value =
      nitro ? .065 : .035;

  }


  /* UI */

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "coins"
  ).textContent=
    coins;

  document.getElementById(
    "speed"
  ).textContent=
    Math.floor(speed);

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,0,W,H
  );

  drawRoad();


  /* COINS */

  for(const c of coinList){

    drawCoin(c);

  }


  /* TRAFFIC */

  for(const car of traffic){

    drawCar(
      car.x,
      car.y,
      car.width,
      car.height,
      car.type
    );

  }


  /* PLAYER */

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    "player"
  );


  /* NITRO FLAME */

  if(nitro && running){

    ctx.save();

    ctx.translate(
      player.x,
      player.y+70
    );

    const flame =
      ctx.createLinearGradient(
        0,0,
        0,55
      );

    flame.addColorStop(
      0,
      "#ffffff"
    );

    flame.addColorStop(
      .3,
      "#38bdf8"
    );

    flame.addColorStop(
      1,
      "transparent"
    );

    ctx.fillStyle=flame;

    ctx.beginPath();

    ctx.moveTo(-10,0);
    ctx.lineTo(0,60);
    ctx.lineTo(10,0);

    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  const dt =
    Math.min(
      .035,
      (time-lastTime)/1000 || 0
    );

  lastTime=time;

  update(dt);

  draw();

  requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.key]=true;

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      moveLeft();

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      moveRight();

    }

    if(
      e.key==="ArrowDown" ||
      e.key===" "
    ){

      brake=true;

      brakeSound();

    }

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      nitro=true;

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowDown" ||
      e.key===" "
    ){

      brake=false;

    }

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      nitro=false;

    }

  }
);


/* =====================================================
   MOVEMENT
===================================================== */

function moveLeft(){

  if(!running)
    return;

  player.lane=
    Math.max(
      0,
      player.lane-1
    );

}


function moveRight(){

  if(!running)
    return;

  player.lane=
    Math.min(
      2,
      player.lane+1
    );

}


/* =====================================================
   MOBILE BUTTONS
===================================================== */

function pressButton(
  element,
  down,
  up
){

  element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      down();

    }
  );

  element.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();

      up();

    }
  );

  element.addEventListener(
    "pointercancel",
    up
  );

  element.addEventListener(
    "pointerleave",
    up
  );

}


pressButton(
  document.getElementById("leftBtn"),

  ()=>{
    moveLeft();
  },

  ()=>{}
);


pressButton(
  document.getElementById("rightBtn"),

  ()=>{
    moveRight();
  },

  ()=>{}
);


pressButton(
  document.getElementById("brakeBtn"),

  ()=>{
    brake=true;
    brakeSound();
  },

  ()=>{
    brake=false;
  }
);


pressButton(
  document.getElementById("nitroBtn"),

  ()=>{
    nitro=true;
  },

  ()=>{
    nitro=false;
  }
);


/* =====================================================
   START / RESTART
===================================================== */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startGame
);


document.getElementById(
  "restartBtn"
).addEventListener(
  "click",
  startGame
);


/* =====================================================
   INITIAL POSITION
===================================================== */

player.x=
  laneX(1);

player.y=
  H*.72;


/* =====================================================
   DRAW INITIAL
===================================================== */

draw();

</script>

</body>
</html>
