<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🏎️ Ahsan Racing</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070c;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
  touch-action:none;
}

/* =========================
   GAME
========================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#101722;
}

/* SKY */

.sky{
  position:absolute;
  inset:0 0 48% 0;

  background:
    linear-gradient(
      #071a38 0%,
      #164e7a 55%,
      #73b6d8 100%
    );
}

/* SUN */

.sun{
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;

  background:#ffe9a6;

  right:12%;
  top:9%;

  box-shadow:
    0 0 70px rgba(255,220,120,.7);
}

/* MOUNTAINS */

.mountains{
  position:absolute;
  bottom:46%;
  left:0;

  width:100%;
  height:180px;

  background:
    linear-gradient(135deg,
      transparent 25%,
      #172636 26%,
      #172636 45%,
      transparent 46%
    ),
    linear-gradient(45deg,
      transparent 28%,
      #203345 29%,
      #203345 50%,
      transparent 51%
    );

  background-size:320px 180px;
  opacity:.9;
}

/* ROAD */

.road{
  position:absolute;

  left:50%;
  top:32%;

  width:62%;
  height:80%;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #111 0%,
      #242424 4%,
      #292929 50%,
      #242424 96%,
      #111 100%
    );

  clip-path:
    polygon(
      43% 0,
      57% 0,
      100% 100%,
      0 100%
    );
}

/* ROAD EDGE */

.road::before,
.road::after{
  content:"";

  position:absolute;

  top:0;

  width:6px;
  height:100%;

  background:#e9e9e9;
}

.road::before{
  left:42%;
}

.road::after{
  right:42%;
}

/* LANE LINES */

.lane{
  position:absolute;

  top:0;
  left:50%;

  width:7px;
  height:100%;

  transform:translateX(-50%);

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 55px,
      #eee 55px 105px
    );

  opacity:.9;
}

/* ROAD MOTION */

#roadMove{
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0 90px,
      rgba(255,255,255,.06) 90px 96px
    );

  animation:roadMove .35s linear infinite;

  pointer-events:none;
}

@keyframes roadMove{
  from{background-position:0 0}
  to{background-position:0 180px}
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;

  top:18px;
  left:18px;
  right:18px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  z-index:50;

  pointer-events:none;
}

.hud-box{
  min-width:115px;

  padding:10px 14px;

  border-radius:14px;

  background:rgba(5,10,18,.78);

  border:1px solid rgba(255,255,255,.13);

  backdrop-filter:blur(8px);

  box-shadow:
    0 8px 25px rgba(0,0,0,.3);
}

.hud-label{
  display:block;

  color:#94a3b8;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:1px;
}

.hud-value{
  display:block;

  margin-top:3px;

  font-size:22px;

  font-weight:bold;
}

#speed{
  color:#38bdf8;
}

#coins{
  color:#ffd43b;
}

/* NITRO */

.nitro-wrap{
  position:absolute;

  top:95px;
  right:20px;

  width:170px;

  z-index:50;
}

.nitro-title{
  font-size:11px;
  color:#cbd5e1;
  margin-bottom:5px;
}

.nitro-bar{
  height:10px;

  border-radius:20px;

  background:#172033;

  overflow:hidden;

  border:1px solid #334155;
}

#nitro{
  height:100%;
  width:100%;

  background:
    linear-gradient(90deg,#00b7ff,#7c3aed);

  transition:.1s;
}

/* =========================
   PLAYER CAR
========================= */

.player{
  position:absolute;

  width:95px;
  height:175px;

  left:50%;
  bottom:75px;

  transform:translateX(-50%);

  z-index:30;

  transition:left .08s linear;
}

/* car shadow */

.car-shadow{
  position:absolute;

  width:95px;
  height:30px;

  bottom:-3px;
  left:0;

  background:rgba(0,0,0,.6);

  border-radius:50%;

  filter:blur(8px);
}

/* BODY */

.car-body{
  position:absolute;

  left:13px;
  top:5px;

  width:69px;
  height:160px;

  border-radius:23px 23px 15px 15px;

  background:
    linear-gradient(
      90deg,
      #8b0000,
      #ef233c 28%,
      #ff4b5c 50%,
      #c70020 72%,
      #72000e
    );

  box-shadow:
    inset 5px 0 8px rgba(255,255,255,.18),
    inset -5px 0 8px rgba(0,0,0,.35),
    0 12px 25px rgba(0,0,0,.5);

  border:1px solid rgba(255,255,255,.25);
}

/* windshield */

.windshield{
  position:absolute;

  left:12px;
  top:30px;

  width:45px;
  height:43px;

  border-radius:12px 12px 7px 7px;

  background:
    linear-gradient(
      135deg,
      #b9e9ff,
      #16344f 45%,
      #07101c
    );

  border:2px solid rgba(255,255,255,.2);
}

/* hood */

.hood{
  position:absolute;

  left:7px;
  top:77px;

  width:55px;
  height:42px;

  border-radius:15px;

  background:
    linear-gradient(
      #ef334c,
      #a90019
    );
}

/* headlights */

.light{
  position:absolute;

  width:13px;
  height:8px;

  background:#fff8c4;

  border-radius:5px;

  top:82px;

  box-shadow:
    0 0 15px #fff;
}

.light.left{
  left:7px;
}

.light.right{
  right:7px;
}

/* wheels */

.wheel{
  position:absolute;

  width:13px;
  height:38px;

  background:#050505;

  border-radius:7px;

  top:42px;
}

.wheel.left{
  left:-6px;
}

.wheel.right{
  right:-6px;
}

.wheel.back-left{
  left:-6px;
  bottom:20px;
  top:auto;
}

.wheel.back-right{
  right:-6px;
  bottom:20px;
  top:auto;
}

/* rear light */

.rear-light{
  position:absolute;

  width:12px;
  height:5px;

  background:#ff1838;

  bottom:17px;

  border-radius:5px;

  box-shadow:0 0 10px #ff1838;
}

.rear-light.left{
  left:10px;
}

.rear-light.right{
  right:10px;
}

/* =========================
   TRAFFIC CARS
========================= */

.traffic{
  position:absolute;

  width:68px;
  height:115px;

  z-index:20;

  pointer-events:none;
}

.traffic-body{
  position:absolute;

  inset:0 8px;

  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #222,
      #777,
      #222
    );

  box-shadow:
    0 10px 20px rgba(0,0,0,.5);
}

.traffic-window{
  position:absolute;

  left:17px;
  top:20px;

  width:34px;
  height:31px;

  border-radius:9px;

  background:#172b3d;
}

.traffic-wheel{
  position:absolute;

  width:9px;
  height:25px;

  background:#050505;

  border-radius:5px;

  top:30px;
}

.traffic-wheel.l{
  left:3px;
}

.traffic-wheel.r{
  right:3px;
}

/* =========================
   COINS
========================= */

.coin{
  position:absolute;

  width:28px;
  height:28px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fff29a 0 20%,
      #ffd43b 22% 65%,
      #d69e00 67% 100%
    );

  border:2px solid #fff0a3;

  box-shadow:
    0 0 15px rgba(255,212,59,.7);

  z-index:22;

  animation:coinSpin .7s linear infinite;
}

@keyframes coinSpin{
  0%{transform:rotateY(0)}
  50%{transform:rotateY(90deg)}
  100%{transform:rotateY(180deg)}
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;

  left:0;
  right:0;
  bottom:18px;

  z-index:60;

  display:flex;

  justify-content:space-between;

  align-items:end;

  padding:0 20px;

  pointer-events:none;
}

.control-group{
  display:flex;
  gap:10px;

  pointer-events:auto;
}

.control{
  width:58px;
  height:58px;

  border:1px solid rgba(255,255,255,.2);

  border-radius:17px;

  background:rgba(8,14,24,.8);

  color:white;

  font-size:22px;

  backdrop-filter:blur(8px);

  cursor:pointer;

  user-select:none;
}

.control:active{
  transform:scale(.92);
  background:#2563eb;
}

#nitroButton{
  width:75px;
  height:75px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #2563eb,
      #172554
    );

  border:2px solid #38bdf8;

  font-size:27px;
}

/* =========================
   START SCREEN
========================= */

.start-screen{
  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:20px;

  background:
    linear-gradient(
      rgba(2,6,23,.75),
      rgba(2,6,23,.93)
    );
}

.start-box{
  width:min(520px,100%);

  padding:35px;

  border-radius:25px;

  background:rgba(15,23,42,.92);

  border:1px solid rgba(56,189,248,.25);

  box-shadow:
    0 30px 80px rgba(0,0,0,.5);

  backdrop-filter:blur(15px);
}

.start-box h1{
  font-size:42px;

  margin-bottom:10px;

  background:
    linear-gradient(
      90deg,
      #38bdf8,
      #818cf8
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.start-box p{
  color:#94a3b8;

  line-height:1.7;

  margin-bottom:25px;
}

.start-btn{
  width:100%;

  padding:16px;

  border:0;

  border-radius:12px;

  background:#2563eb;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 10px 30px rgba(37,99,235,.3);
}

.start-btn:hover{
  background:#1d4ed8;
}

/* =========================
   GAME OVER
========================= */

.game-over{
  display:none;

  position:absolute;

  inset:0;

  z-index:90;

  background:rgba(2,6,23,.82);

  align-items:center;

  justify-content:center;

  text-align:center;
}

.game-over-box{
  padding:35px;

  width:min(420px,90%);

  background:#0f172a;

  border:1px solid #334155;

  border-radius:25px;
}

.game-over h2{
  font-size:38px;

  margin-bottom:15px;
}

.restart{
  margin-top:20px;

  padding:14px 25px;

  border:0;

  border-radius:10px;

  background:#2563eb;

  color:white;

  font-weight:bold;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .road{
    width:90%;
  }

  .player{
    width:82px;
    height:150px;
    bottom:105px;
  }

  .car-body{
    transform:scale(.87);
    transform-origin:top center;
  }

  .hud{
    top:10px;
    left:10px;
    right:10px;
  }

  .hud-box{
    min-width:90px;
    padding:8px 10px;
  }

  .hud-value{
    font-size:18px;
  }

  .nitro-wrap{
    top:82px;
    right:10px;
    width:130px;
  }

  .controls{
    bottom:10px;
    padding:0 12px;
  }

  .control{
    width:52px;
    height:52px;
  }

  #nitroButton{
    width:65px;
    height:65px;
  }

  .start-box{
    padding:28px 20px;
  }

  .start-box h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="sky"></div>
  <div class="sun"></div>
  <div class="mountains"></div>

  <div class="road">
    <div class="lane"></div>
    <div id="roadMove"></div>
  </div>

  <!-- HUD -->

  <div class="hud">

    <div class="hud-box">
      <span class="hud-label">Speed</span>
      <span class="hud-value">
        <span id="speed">0</span> KM/H
      </span>
    </div>

    <div class="hud-box">
      <span class="hud-label">Coins</span>
      <span class="hud-value" id="coins">
        0
      </span>
    </div>

  </div>

  <div class="nitro-wrap">

    <div class="nitro-title">
      NITRO
    </div>

    <div class="nitro-bar">
      <div id="nitro"></div>
    </div>

  </div>

  <!-- PLAYER -->

  <div class="player" id="player">

    <div class="car-shadow"></div>

    <div class="car-body">

      <div class="windshield"></div>

      <div class="hood"></div>

      <div class="light left"></div>
      <div class="light right"></div>

      <div class="wheel left"></div>
      <div class="wheel right"></div>

      <div class="wheel back-left"></div>
      <div class="wheel back-right"></div>

      <div class="rear-light left"></div>
      <div class="rear-light right"></div>

    </div>

  </div>

  <!-- CONTROLS -->

  <div class="controls">

    <div class="control-group">

      <button class="control" id="left">
        ◀
      </button>

      <button class="control" id="right">
        ▶
      </button>

    </div>

    <div class="control-group">

      <button class="control" id="brake">
        🛑
      </button>

      <button class="control" id="nitroButton">
        ⚡
      </button>

    </div>

  </div>

  <!-- START -->

  <div class="start-screen" id="startScreen">

    <div class="start-box">

      <h1>
        🏎️ AHSAN RACING
      </h1>

      <p>
        High-speed highway racing with traffic,
        coins, nitro and engine sound.
      </p>

      <p>
        ◀ ▶ Steer &nbsp; • &nbsp;
        🛑 Brake &nbsp; • &nbsp;
        ⚡ Nitro
      </p>

      <button
        class="start-btn"
        id="startButton"
      >
        START RACE
      </button>

    </div>

  </div>

  <!-- GAME OVER -->

  <div class="game-over" id="gameOver">

    <div class="game-over-box">

      <h2>
        💥 RACE OVER
      </h2>

      <p>
        Coins collected:
        <strong id="finalCoins">0</strong>
      </p>

      <button
        class="restart"
        id="restartButton"
      >
        🔄 RACE AGAIN
      </button>

    </div>

  </div>

</div>

<script>
/* =====================================================
   AHSAN RACING ENGINE
===================================================== */

const game = document.getElementById("game");
const player = document.getElementById("player");

const speedText = document.getElementById("speed");
const coinText = document.getElementById("coins");
const nitroBar = document.getElementById("nitro");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const gameOver = document.getElementById("gameOver");
const finalCoins = document.getElementById("finalCoins");
const restartButton = document.getElementById("restartButton");

const roadMove = document.getElementById("roadMove");

/* GAME VARIABLES */

let running = false;

let playerX = window.innerWidth / 2;

let speed = 0;
let targetSpeed = 120;

let coins = 0;

let nitro = 100;

let braking = false;
let nitroActive = false;

let trafficCars = [];
let coinObjects = [];

let spawnTimer = 0;
let coinTimer = 0;

let lastTime = 0;

/* STEERING */

let leftPressed = false;
let rightPressed = false;

/* AUDIO */

let audioContext = null;
let engineOscillator = null;
let engineGain = null;

/* =========================
   AUDIO
========================= */

function startEngineSound(){

  try{

    audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();

    engineOscillator =
      audioContext.createOscillator();

    engineGain =
      audioContext.createGain();

    engineOscillator.type = "sawtooth";

    engineOscillator.frequency.value = 90;

    engineGain.gain.value = 0.025;

    engineOscillator
      .connect(engineGain)
      .connect(audioContext.destination);

    engineOscillator.start();

  }catch(error){

    console.log("Audio unavailable");

  }

}

function updateEngineSound(){

  if(!engineOscillator) return;

  const frequency =
    70 + speed * 1.8;

  engineOscillator.frequency
    .setTargetAtTime(
      frequency,
      audioContext.currentTime,
      .05
    );

}

/* =========================
   START
========================= */

function startGame(){

  startScreen.style.display = "none";
  gameOver.style.display = "none";

  running = true;

  speed = 90;
  targetSpeed = 150;

  coins = 0;
  nitro = 100;

  playerX =
    window.innerWidth / 2;

  player.style.left =
    playerX + "px";

  clearObjects();

  startEngineSound();

  lastTime =
    performance.now();

  requestAnimationFrame(gameLoop);

}

/* =========================
   RESET
========================= */

function clearObjects(){

  trafficCars.forEach(car =>
    car.element.remove()
  );

  coinObjects.forEach(coin =>
    coin.remove()
  );

  trafficCars = [];
  coinObjects = [];

}

/* =========================
   TRAFFIC
========================= */

function createTraffic(){

  const car =
    document.createElement("div");

  car.className = "traffic";

  const colors = [
    "#151515",
    "#f5f5f5",
    "#2563eb",
    "#16a34a",
    "#7c3aed",
    "#d97706"
  ];

  const color =
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  car.innerHTML = `

    <div
      class="traffic-body"
      style="background:
      linear-gradient(
        90deg,
        ${color},
        #ffffff55,
        ${color}
      )">
    </div>

    <div class="traffic-window"></div>

    <div class="traffic-wheel l"></div>
    <div class="traffic-wheel r"></div>

  `;

  game.appendChild(car);

  const lanes = [
    -110,
    -55,
    0,
    55,
    110
  ];

  const lane =
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];

  const x =
    window.innerWidth/2 + lane;

  car.style.left =
    (x - 34) + "px";

  car.style.top =
    "-150px";

  trafficCars.push({
    element:car,
    x:x,
    y:-150,
    speed:
      2 + Math.random()*1.8
  });

}

/* =========================
   COINS
========================= */

function createCoin(){

  const coin =
    document.createElement("div");

  coin.className = "coin";

  const lanes = [
    -100,
    -50,
    0,
    50,
    100
  ];

  const lane =
    lanes[
      Math.floor(
        Math.random()*lanes.length
      )
    ];

  const x =
    window.innerWidth/2 + lane;

  coin.style.left =
    (x - 14) + "px";

  coin.style.top =
    "-40px";

  game.appendChild(coin);

  coinObjects.push({
    element:coin,
    x:x,
    y:-40
  });

}

/* =========================
   COLLISION
========================= */

function collision(
  ax,
  ay,
  aw,
  ah,
  bx,
  by,
  bw,
  bh
){

  return (
    ax < bx+bw &&
    ax+aw > bx &&
    ay < by+bh &&
    ay+ah > by
  );

}

/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

  if(!running) return;

  const dt =
    Math.min(
      (time-lastTime)/16.67,
      2
    );

  lastTime = time;

  update(dt);

  requestAnimationFrame(gameLoop);

}

/* =========================
   UPDATE
========================= */

function update(dt){

  /* SPEED */

  if(braking){

    targetSpeed = 55;

  }else if(nitroActive && nitro > 0){

    targetSpeed = 240;

  }else{

    targetSpeed = 155;

  }

  speed +=
    (targetSpeed-speed)
    * .035
    * dt;

  if(nitroActive){

    nitro -=
      .7 * dt;

    if(nitro <= 0){

      nitro = 0;
      nitroActive = false;

    }

  }else{

    nitro +=
      .025 * dt;

    if(nitro > 100)
      nitro = 100;

  }

  /* STEERING */

  const steeringSpeed =
    7 * dt;

  if(leftPressed){

    playerX -=
      steeringSpeed *
      (speed/100);

  }

  if(rightPressed){

    playerX +=
      steeringSpeed *
      (speed/100);

  }

  /* ROAD BOUNDS */

  const center =
    window.innerWidth/2;

  const roadLimit =
    Math.min(
      window.innerWidth*.30,
      270
    );

  playerX =
    Math.max(
      center-roadLimit,
      Math.min(
        center+roadLimit,
        playerX
      )
    );

  player.style.left =
    playerX + "px";

  /* ROAD SPEED */

  roadMove.style.animationDuration =
    Math.max(
      .08,
      .45 - speed/500
    ) + "s";

  /* HUD */

  speedText.textContent =
    Math.round(speed);

  coinText.textContent =
    coins;

  nitroBar.style.width =
    nitro + "%";

  updateEngineSound();

  /* TRAFFIC */

  spawnTimer += dt;

  if(
    spawnTimer >
    Math.max(
      30,
      75-speed/4
    )
  ){

    createTraffic();

    spawnTimer = 0;

  }

  trafficCars.forEach(
    (car,index)=>{

      car.y +=
        (car.speed +
        speed/55) * dt;

      car.element.style.top =
        car.y + "px";

      /* collision */

      if(
        collision(
          playerX-38,
          window.innerHeight-250,
          76,
          140,

          car.x-28,
          car.y,
          56,
          105
        )
      ){

        endGame();

      }

      if(
        car.y >
        window.innerHeight+150
      ){

        car.element.remove();

        trafficCars.splice(
          index,
          1
        );

      }

    }
  );

  /* COINS */

  coinTimer += dt;

  if(coinTimer > 45){

    createCoin();

    coinTimer = 0;

  }

  coinObjects.forEach(
    (coin,index)=>{

      coin.y +=
        (4+speed/50)*dt;

      coin.element.style.top =
        coin.y+"px";

      if(
        collision(
          playerX-40,
          window.innerHeight-240,
          80,
          145,

          coin.x-14,
          coin.y,
          28,
          28
        )
      ){

        coins++;

        coin.element.remove();

        coinObjects.splice(
          index,
          1
        );

      }

      if(
        coin.y >
        window.innerHeight+50
      ){

        coin.element.remove();

        coinObjects.splice(
          index,
          1
        );

      }

    }
  );

}

/* =========================
   GAME OVER
========================= */

function endGame(){

  if(!running) return;

  running = false;

  finalCoins.textContent =
    coins;

  gameOver.style.display =
    "flex";

  if(
    engineOscillator &&
    audioContext
  ){

    engineGain.gain.setTargetAtTime(
      0,
      audioContext.currentTime,
      .1
    );

  }

}

/* =========================
   BUTTON CONTROLS
========================= */

function holdButton(
  element,
  onStart,
  onEnd
){

  element.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      onStart();
    }
  );

  element.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      onEnd();
    }
  );

  element.addEventListener(
    "pointercancel",
    onEnd
  );

  element.addEventListener(
    "pointerleave",
    onEnd
  );

}

holdButton(
  document.getElementById("left"),
  ()=>leftPressed=true,
  ()=>leftPressed=false
);

holdButton(
  document.getElementById("right"),
  ()=>rightPressed=true,
  ()=>rightPressed=false
);

holdButton(
  document.getElementById("brake"),
  ()=>braking=true,
  ()=>braking=false
);

holdButton(
  document.getElementById("nitroButton"),
  ()=>nitroActive=true,
  ()=>nitroActive=false
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft" ||
       e.key.toLowerCase()==="a"){

      leftPressed=true;

    }

    if(e.key==="ArrowRight" ||
       e.key.toLowerCase()==="d"){

      rightPressed=true;

    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      braking=true;

    }

    if(
      e.code==="Space" ||
      e.key.toLowerCase()==="n"
    ){

      nitroActive=true;

    }

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft" ||
       e.key.toLowerCase()==="a"){

      leftPressed=false;

    }

    if(e.key==="ArrowRight" ||
       e.key.toLowerCase()==="d"){

      rightPressed=false;

    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      braking=false;

    }

    if(
      e.code==="Space" ||
      e.key.toLowerCase()==="n"
    ){

      nitroActive=false;

    }

  }
);

/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
  "click",
  startGame
);

restartButton.addEventListener(
  "click",
  startGame
);

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{
    playerX =
      Math.min(
        window.innerWidth-50,
        Math.max(50,playerX)
      );
  }
);
</script>
